name: update-report
on:
  schedule:
    - cron: '30 22 * * *'   # 台北 06:30：美股前夜收盤後
    - cron: '30 6 * * *'    # 台北 14:30：亞洲收盤後
    - cron: '30 13 * * *'   # 台北 21:30：歐洲收盤後
  workflow_dispatch:
    inputs:
      days:
        description: '回溯天數（首次建議 30，之後用 1）'
        default: '1'
permissions:
  contents: write
concurrency: update-report
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          DAYS: ${{ github.event.inputs.days || '1' }}
      - run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update report" && git push)
