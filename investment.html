<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生技投資情報工作台</title>
<style>
:root{color-scheme:light;--bg:#f5f7fa;--panel:#fff;--ink:#17212f;--muted:#657286;--line:#dce3eb;--blue:#175ca8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:1200px;margin:auto;padding:22px}h1{font-size:1.7rem;margin:0}h2{font-size:1.1rem;margin:0 0 10px}.sub{color:var(--muted);margin:5px 0 18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.stat,.panel,.event{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.num{font-size:1.55rem;font-weight:750}.muted{color:var(--muted);font-size:.86rem}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.tools input,.tools select,.tools button{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:white;min-width:120px}.tools input{flex:1}.tools button{cursor:pointer;color:var(--blue)}
.events{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.event h3{font-size:1.03rem;margin:7px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.75rem;border:1px solid var(--line);padding:2px 7px;border-radius:99px;color:var(--muted)}.tag.score{color:var(--blue);border-color:#9bbde7}.event p{margin:8px 0}.event .footer{border-top:1px solid var(--line);margin-top:10px;padding-top:9px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.event a{color:var(--blue)}
.notice{padding:10px 12px;border-radius:8px;background:#fff4df;color:#754500;margin:12px 0}.empty{padding:30px;text-align:center;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:12px}
@media(max-width:720px){main{padding:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.events{grid-template-columns:1fr}h1{font-size:1.4rem}}
</style></head><body><main>
<h1>生技投資情報工作台</h1><p class="sub">把藥監決策、公司事件與產業趨勢放在同一個研究流程中。評分僅為規則式排序提示，不是投資建議。</p>
<div id="status" class="panel">正在載入最新報告…</div><div class="stats">
<div class="stat"><div class="muted">公司重大事件</div><div class="num" id="nco">—</div></div><div class="stat"><div class="muted">藥監與法規事件</div><div class="num" id="nreg">—</div></div><div class="stat"><div class="muted">未來催化劑</div><div class="num" id="ncat">—</div></div><div class="stat"><div class="muted">產業趨勢</div><div class="num" id="ndeep">—</div></div><div class="stat"><div class="muted">報價標的</div><div class="num" id="nquote">—</div></div></div>
<div class="panel"><h2>研究篩選</h2><div class="tools"><input id="q" placeholder="搜尋公司、藥品、適應症、催化劑或事件"><select id="kind"><option value="all">全部類型</option><option value="company">公司事件</option><option value="reg">藥監／法規</option><option value="catalyst">未來催化劑</option><option value="deep">產業趨勢</option></select><select id="lifecycle"><option value="all">全部催化劑狀態</option><option value="即將到期">即將到期</option><option value="今日到期">今日到期</option><option value="日期已過・待確認">日期已過・待確認</option><option value="日期曾變更">日期曾變更</option><option value="結果已公布">結果已公布</option><option value="已延期">已延期</option><option value="已取消">已取消</option></select><select id="sort"><option value="score">投資關聯度優先</option><option value="date">日期由新到舊</option></select><select id="follow"><option value="all">全部公司</option><option value="watch">只看追蹤公司</option></select><button id="export">匯出目前結果 CSV</button></div><div class="muted">排序提示依後續催化劑、臨床／核准／財務關鍵詞與資料日期計算；請閱讀來源並自行判斷重要性。</div></div>
<div id="notice"></div><h2 style="margin:18px 0 10px">事件與催化劑</h2><div id="events" class="events"></div>
<p class="muted" style="margin-top:18px">資料沿用情報站的 report.json。新聞與 AI 摘要可能有誤；重大投資決策前請核對公司公告、監管機關及原始論文。</p></main>
<script>
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeUrl=u=>{try{const x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}};const dateOK=d=>/^\d{4}\/\d{2}\/\d{2}$/.test(d||'');let all=[];const watchlist=new Set(JSON.parse(localStorage.getItem('healthcare.watchlist')||'[]'));const watchKey=e=>e.ticker||e.company||e.title;
function assess(e){const s=(e.title+' '+e.event+' '+e.catalyst+' '+e.summary+' '+e.detail+' '+(e.raw?.type||'')).toLowerCase();let importance=1;for(const [re,p] of [[/phase 3|phase iii|臨床三期|三期|pdufa|核准|批准|上市申請|優先審查|收購|併購|授權|license|acquisition|主要讀出|主要終點/i,5],[/臨床二期|phase 2|臨床|試驗|readout|數據|財報|營收|合作|里程碑|專利|支付|給付|chmp/i,3],[/催化|預定|預計|申請|審議|審查|試驗啟動/i,2]])if(re.test(s))importance=Math.max(importance,p);if(e.kind==='reg')importance=Math.max(importance,4);let time=1;if(dateOK(e.date)){const days=(new Date(e.date.replaceAll('/','-')+'T12:00:00Z').getTime()-Date.now())/86400000;if(days<0)time=2;else if(days<=30)time=5;else if(days<=90)time=4;else if(days<=180)time=3;else if(days<=365)time=2;}let host='';try{host=new URL(e.url).hostname.toLowerCase();if(host.startsWith('www.'))host=host.slice(4)}catch{}let evidence=1;if(host.includes('fda.gov')||host.includes('ema.europa.eu')||host.includes('clinicaltrials.gov')||host.includes('pubmed.ncbi.nlm.nih.gov')||host.endsWith('.gov'))evidence=5;else if(/investor|ir\.|sec\.gov|nasdaq|nyse|twse|mops|company|annualreports/i.test(host))evidence=4;else if(/reuters|bloomberg|statnews|fiercebiotech|endpts|nature|science|thelancet/i.test(host))evidence=3;else if(host)evidence=2;const total=Math.round((importance/5)*45+(time/5)*30+(evidence/5)*25);return {importance,time,evidence,total,host}}function score(e){return assess(e).total}
function normalize(r){const out=[];(r.co||[]).forEach(x=>out.push({kind:'company',date:x.date,title:(x.name||x.sym||'公司事件')+'｜'+(x.event||'重大進展'),company:x.name||x.sym||'',ticker:x.sym||'',summary:x.impact||'',catalyst:x.catalyst||'',detail:x.event||'',url:safeUrl(x.url),market:x.market||'',raw:x}));(r.reg||[]).forEach(x=>out.push({kind:'reg',date:x.date,title:(x.org||'藥監')+'｜'+(x.name||'監管事件'),company:x.company||'',ticker:'',summary:x.value||'',catalyst:/PDUFA|CHMP|審議中/.test(x.type||'')?x.type:'',detail:[x.type,x.indication].filter(Boolean).join(' · '),url:safeUrl(x.url),market:x.org||'',raw:x}));(r.cat||[]).forEach(x=>out.push({kind:'catalyst',date:x.date,title:(x.company||'公司')+'｜'+(x.title||x.asset||'未來催化劑'),company:x.company||'',ticker:'',summary:x.impact||'',catalyst:(x.status||'日期狀態待確認')+' · '+(x.type||''),detail:[x.asset,'來源：'+(x.sourceName||''),(x.history||[]).length?'日期變更紀錄 '+x.history.length+' 次':''].filter(Boolean).join(' · '),url:safeUrl(x.url),market:'未來里程碑',lifecycle:x.lifecycle||'',raw:x}));(r.deep||[]).forEach(x=>out.push({kind:'deep',date:x.d,title:x.title||'產業趨勢',company:(x.cos||[]).map(c=>c.n).filter(Boolean).join('、'),ticker:(x.cos||[]).map(c=>c.s).filter(Boolean).join(', '),summary:(x.points||[]).join(' '),catalyst:x.trend||'',detail:x.type||'',url:safeUrl(x.url),market:'全球',raw:x}));return out.filter(e=>e.title)}
function render(){const q=$('#q').value.trim().toLowerCase(),kind=$('#kind').value,life=$('#lifecycle').value,sort=$('#sort').value;const list=all.filter(e=>(kind==='all'||e.kind===kind)&&(life==='all'||(e.kind==='catalyst'&&e.lifecycle===life))&&(!q||[e.title,e.company,e.ticker,e.summary,e.catalyst,e.detail,e.market].join(' ').toLowerCase().includes(q))&&($('#follow').value!=='watch'||watchlist.has(watchKey(e))));list.sort(sort==='date'?(a,b)=>(b.date||'').localeCompare(a.date||''):(a,b)=>score(b)-score(a)||(b.date||'').localeCompare(a.date||''));$('#events').innerHTML=list.length?list.map(e=>'<article class="event"><div class="tags"><span class="tag">'+(e.kind==='company'?'公司事件':e.kind==='reg'?'藥監／法規':e.kind==='catalyst'?'未來催化劑':'產業趨勢')+'</span><span class="tag">'+esc(e.market||'')+'</span>'+(e.lifecycle?'<span class="tag lifecycle">'+esc(e.lifecycle)+'</span>':'')+'<span class="tag score">研究優先 '+score(e)+'/100</span>'</div><h3>'+esc(e.title)+'</h3><div class="muted">'+esc(e.date||'日期待確認')+(e.ticker?' · '+esc(e.ticker):'')+'</div>'+'<p class="muted">規則拆解：重要性 '+assess(e).importance+'/5 · 時間敏感度 '+assess(e).time+'/5 · 來源品質 '+assess(e).evidence+'/5</p>'+(e.detail?'<p>'+esc(e.detail)+'</p>':'')+(e.summary?'<p>'+esc(e.summary)+'</p>':'')+(e.catalyst?'<p><b>後續催化劑／觀察：</b>'+esc(e.catalyst)+'</p>':'')+'<div class="footer"><span class="muted">'+esc(e.company||'')+'</span><button type="button" class="watch" data-watch="'+esc(watchKey(e))+'">'+(watchlist.has(watchKey(e))?'★ 已追蹤':'☆ 追蹤')+'</button>'+(e.url?'<a href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">檢視來源 ↗</a>':'<span class="muted">無有效來源連結</span>')+'</div></article>').join(''):'<div class="empty">沒有符合條件的事件。試試其他關鍵字或類型。</div>'}
async function init(){try{const res=await fetch('data/report.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const r=await res.json();if(!r||!Array.isArray(r.co)||!Array.isArray(r.reg)||!Array.isArray(r.deep))throw new Error('報告格式不符合預期');all=normalize(r);$('#nco').textContent=r.co.length;$('#nreg').textContent=r.reg.length;$('#ncat').textContent=(r.cat||[]).length;$('#ndeep').textContent=r.deep.length;$('#nquote').textContent=Object.keys(r.quotes||{}).length;const ts=Number(r.ts),age=Number.isFinite(ts)?Math.max(0,(Date.now()-ts)/3600000):Infinity;$('#status').innerHTML='<b>資料更新：</b>'+(Number.isFinite(ts)?new Date(ts).toLocaleString('zh-TW'):'時間未知')+' · <b>報告視窗：</b>'+esc(r.window??'—')+' 天';if(age>30)$('#notice').innerHTML='<div class="notice">資料可能已過期（超過 30 小時未更新）。請確認 GitHub Actions 最近一次執行狀態。</div>';else if(age>18)$('#notice').innerHTML='<div class="notice">資料更新稍有延遲；投資前請確認最新公司公告及監管來源。</div>';render()}catch(e){$('#status').innerHTML='<div class="notice">無法載入報告：'+esc(e.message)+'。請返回 <a href="index.html">主情報站</a>，並檢查 data/report.json 是否可用。</div>'}}
$('#events').addEventListener('click',e=>{const b=e.target.closest('[data-watch]');if(!b)return;const k=b.dataset.watch;if(watchlist.has(k))watchlist.delete(k);else watchlist.add(k);localStorage.setItem('healthcare.watchlist',JSON.stringify([...watchlist]));render()});
$('#export').addEventListener('click',()=>{const q=$('#q').value.trim().toLowerCase(),kind=$('#kind').value,life=$('#lifecycle').value,follow=$('#follow').value,sort=$('#sort').value;const rows=all.filter(e=>(kind==='all'||e.kind===kind)&&(life==='all'||(e.kind==='catalyst'&&e.lifecycle===life))&&(!q||[e.title,e.company,e.ticker,e.summary,e.catalyst,e.detail,e.market].join(' ').toLowerCase().includes(q))&&(follow!=='watch'||watchlist.has(watchKey(e))));rows.sort(sort==='date'?(a,b)=>(b.date||'').localeCompare(a.date||''):(a,b)=>score(b)-score(a));const cols=['類型','日期','標題','公司','代號','摘要','後續催化劑','催化劑狀態','日期變更次數','市場','來源'];const val=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\\ufeff'+[cols,...rows.map(e=>[e.kind,e.date,e.title,e.company,e.ticker,e.summary,e.catalyst,e.lifecycle||'',(e.raw?.history||[]).length,e.market,e.url])].map(r=>r.map(val).join(',')).join('\\r\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='healthcare-investment-events.csv';a.click();URL.revokeObjectURL(a.href)});
['#q','#kind','#lifecycle','#sort','#follow'].forEach(s=>$(s).addEventListener('input',render));init();
</script></body></html>
