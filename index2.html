      if (String(chg).includes('▼')) return 'text-emerald-600 font-semibold';
      return 'text-slate-500';
    }

    function agencyBadgeClass(agency) {
      const map = {
        FDA: 'bg-blue-100 text-blue-800 border border-blue-200',
        EMA: 'bg-indigo-100 text-indigo-800 border border-indigo-200',
        NMPA: 'bg-rose-100 text-rose-800 border border-rose-200',
        TFDA: 'bg-emerald-100 text-emerald-800 border border-emerald-200',
        PMDA: 'bg-purple-100 text-purple-800 border border-purple-200'
      };
      return map[agency] || 'bg-slate-100 text-slate-700 border border-slate-200';
    }

    function deepCatClass(cat) {
      if (cat === '政策變化') return 'bg-blue-700 text-white';
      if (cat === '重大事件') return 'bg-rose-700 text-white';
      if (cat === '技術突破') return 'bg-teal-700 text-white';
      return 'bg-slate-800 text-white';
    }

    function outcomeBadge(outcome) {
      if (outcome.includes('優於預期')) return 'bg-emerald-50 text-emerald-700 border-emerald-200';
      if (outcome.includes('低於預期')) return 'bg-rose-50 text-rose-700 border-rose-200';
      if (outcome.includes('符合預期')) return 'bg-sky-50 text-sky-700 border-sky-200';
      return 'bg-amber-50 text-amber-700 border-amber-200';
    }

    function renderExpandableCard(key, headerHtml, bodyHtml, extraClass) {
      const isOpen = Boolean(state.expandedIds[key]);
      return `
        <div class="border border-slate-200 rounded-xl overflow-hidden transition hover:border-slate-300 ${extraClass || 'bg-white'}">
          <button type="button" data-toggle="${escapeHtml(key)}" class="expand-btn w-full text-left px-3.5 py-3 flex items-center justify-between gap-3 cursor-pointer">
            <div class="flex-1 min-w-0">${headerHtml}</div>
            <i data-lucide="${isOpen ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4 text-slate-400 shrink-0"></i>
          </button>
          <div class="${isOpen ? 'block' : 'hidden'} px-3.5 pb-3.5 pt-2 border-t border-slate-100 bg-slate-50/70 text-xs sm:text-sm text-slate-700 leading-relaxed">
            ${bodyHtml}
          </div>
        </div>
      `;
    }

    function renderTableBlock(title, dotColor, headers, rowsHtml) {
      const accentMap = {
        'bg-sky-500': 'border-l-4 border-l-sky-500 bg-sky-50/80',
        'bg-indigo-500': 'border-l-4 border-l-indigo-500 bg-indigo-50/80',
        'bg-emerald-500': 'border-l-4 border-l-emerald-500 bg-emerald-50/80',
        'bg-amber-500': 'border-l-4 border-l-amber-500 bg-amber-50/80'
      };
      const hdrCls = accentMap[dotColor] || 'bg-slate-50';
      return `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="px-4 py-2.5 border-b border-slate-200 ${hdrCls}">
            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full ${dotColor}"></span>
              ${title}
            </h3>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs sm:text-sm">
              <thead>
                <tr class="bg-slate-50/70 text-slate-500 border-b border-slate-200">
                  ${headers.map(h => `<th class="py-2 px-3 font-semibold whitespace-nowrap">${h}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">${rowsHtml}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSection1() {
      const rep = state.reports[state.currentIndex];
      $('editionBadge').textContent = `${rep.date} ${rep.session}`;
      $('editionHeadline').textContent = rep.headline;

      $('datePills').innerHTML = state.reports.map((r, idx) => {
        const active = idx === state.currentIndex;
        return `<button data-idx="${idx}" type="button" class="date-pill px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap cursor-pointer ${active ? 'bg-sky-600 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'}">${r.date} ${r.session}</button>`;
      }).join('');
      $('btnPrevDate').disabled = state.currentIndex <= 0;
      $('btnNextDate').disabled = state.currentIndex >= state.reports.length - 1;

      const q = state.searchQuery.trim().toLowerCase();
      const match = (s) => !q || String(s).toLowerCase().includes(q);
      const filterRep = (r) => ({
        co: r.co.filter(i => (!state.watchlistOnly || i.watchlist) && match(`${i.ticker} ${i.name} ${i.summary} ${i.source}`)),
        reg: r.reg.filter(i => (state.activeAgency === 'all' || i.agency === state.activeAgency) && match(`${i.agency} ${i.title} ${i.detail} ${i.source}`)),
        cat: r.cat.filter(i => match(`${i.asset} ${i.type} ${i.outcome} ${i.note}`)),
        deep: r.deep.filter(i => match(`${i.cat} ${i.title} ${i.body} ${i.source}`))
      });

      const renderBlocks = (r, f, showTag) => {
        const showCo = (state.activeModule === 'all' || state.activeModule === 'co') && f.co.length > 0;
        const showReg = (state.activeModule === 'all' || state.activeModule === 'reg') && f.reg.length > 0;
        const showCat = (state.activeModule === 'all' || state.activeModule === 'cat') && f.cat.length > 0;
        const showDeep = (state.activeModule === 'all' || state.activeModule === 'deep') && f.deep.length > 0;
        if (!showCo && !showReg && !showCat && !showDeep) return '';

        let out = showTag ? `<div class="text-xs font-bold text-slate-700 pt-1">${r.date} ${r.session}｜${escapeHtml(r.headline)}</div>` : '';
        if (state.viewMode === 'table') {
          if (showCo) {
            out += renderTableBlock('公司重大事件', 'bg-sky-500', ['標的', '股價與漲跌', '日期', '重點摘要'], f.co.map((item, idx) => {
              const key = `${r.id}-co-${idx}`, isOpen = Boolean(state.expandedIds[key]), isLong = item.summary.length > 42;
              return `<tr class="hover:bg-slate-50/80">
                <td class="py-2.5 px-3 align-top whitespace-nowrap font-bold text-slate-900">${item.watchlist ? '<span class="text-amber-500 mr-0.5">★</span>' : ''}${highlightText(item.name, q)} <span class="text-xs font-normal text-slate-500">${highlightText(item.ticker, q)}</span></td>
                <td class="py-2.5 px-3 align-top whitespace-nowrap"><span class="font-medium">${escapeHtml(item.price)}</span> <span class="text-xs ${changeColor(item.change)}">${escapeHtml(item.change)}</span></td>
                <td class="py-2.5 px-3 align-top whitespace-nowrap text-xs text-slate-500">${escapeHtml(item.date)}</td>
                <td class="py-2.5 px-3 align-top text-slate-700 min-w-[240px]">${highlightText(isLong && !isOpen ? item.summary.slice(0, 42) + '…' : item.summary, q)} ${isLong ? `<button type="button" data-toggle="${key}" class="expand-btn ml-1 text-xs font-semibold text-sky-600 hover:underline cursor-pointer">${isOpen ? '收合' : '展開'}</button>` : ''} <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="ml-1 text-xs text-sky-600 hover:underline">[${escapeHtml(item.source)}]</a></td>
              </tr>`;
            }).join(''));
          }
          if (showReg) {
            out += renderTableBlock('五大藥監機關動態', 'bg-indigo-500', ['藥監', '日期', '藥品 / 法規案', '最新決議'], f.reg.map((item, idx) => {
              const key = `${r.id}-reg-${idx}`, isOpen = Boolean(state.expandedIds[key]), isLong = item.detail.length > 45;
              return `<tr class="hover:bg-slate-50/80">
                <td class="py-2.5 px-3 align-top whitespace-nowrap"><span class="px-2 py-0.5 rounded text-xs font-bold ${agencyBadgeClass(item.agency)}">${escapeHtml(item.agency)}</span></td>
                <td class="py-2.5 px-3 align-top whitespace-nowrap text-xs text-slate-500">${escapeHtml(item.date)}</td>
                <td class="py-2.5 px-3 align-top font-semibold text-slate-900 whitespace-nowrap">${highlightText(item.title, q)}</td>
                <td class="py-2.5 px-3 align-top text-slate-700 min-w-[240px]">${highlightText(isLong && !isOpen ? item.detail.slice(0, 45) + '…' : item.detail, q)} ${isLong ? `<button type="button" data-toggle="${key}" class="expand-btn ml-1 text-xs font-semibold text-sky-600 hover:underline cursor-pointer">${isOpen ? '收合' : '展開'}</button>` : ''} <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="ml-1 text-xs text-sky-600 hover:underline">[${escapeHtml(item.source)}]</a></td>
              </tr>`;
            }).join(''));
          }
          if (showCat) {
            out += renderTableBlock('催化劑追蹤', 'bg-emerald-500', ['資產 / 標的', '類型', '日期', '評估', '說明'], f.cat.map((item, idx) => {
              const key = `${r.id}-cat-${idx}`, isOpen = Boolean(state.expandedIds[key]), isLong = item.note.length > 40;
              return `<tr class="hover:bg-slate-50/80">
                <td class="py-2.5 px-3 align-top font-bold text-slate-900 whitespace-nowrap">${highlightText(item.asset, q)}</td>
                <td class="py-2.5 px-3 align-top whitespace-nowrap text-xs text-slate-600">${escapeHtml(item.type)}</td>
                <td class="py-2.5 px-3 align-top whitespace-nowrap text-xs text-slate-500">${escapeHtml(item.date)}</td>
                <td class="py-2.5 px-3 align-top whitespace-nowrap"><span class="px-2 py-0.5 rounded-full text-[11px] font-semibold border ${outcomeBadge(item.outcome)}">${escapeHtml(item.outcome)}</span></td>
                <td class="py-2.5 px-3 align-top text-slate-700 min-w-[220px]">${highlightText(isLong && !isOpen ? item.note.slice(0, 40) + '…' : item.note, q)} ${isLong ? `<button type="button" data-toggle="${key}" class="expand-btn ml-1 text-xs font-semibold text-sky-600 hover:underline cursor-pointer">${isOpen ? '收合' : '展開'}</button>` : ''} <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="ml-1 text-xs text-sky-600 hover:underline">[${escapeHtml(item.source)}]</a></td>
              </tr>`;
            }).join(''));
          }
          if (showDeep) {
            out += renderTableBlock('深度研報與趨勢', 'bg-amber-500', ['類別', '主題', '重點解析'], f.deep.map((item, idx) => {
              const key = `${r.id}-deep-${idx}`, isOpen = Boolean(state.expandedIds[key]), isLong = item.body.length > 45;
              return `<tr class="hover:bg-slate-50/80">
                <td class="py-2.5 px-3 align-top whitespace-nowrap"><span class="px-2 py-0.5 rounded text-xs font-semibold ${deepCatClass(item.cat)}">${escapeHtml(item.cat)}</span></td>
                <td class="py-2.5 px-3 align-top font-bold text-slate-900 min-w-[180px]">${highlightText(item.title, q)}</td>
                <td class="py-2.5 px-3 align-top text-slate-700 min-w-[240px]">${highlightText(isLong && !isOpen ? item.body.slice(0, 45) + '…' : item.body, q)} ${isLong ? `<button type="button" data-toggle="${key}" class="expand-btn ml-1 text-xs font-semibold text-sky-600 hover:underline cursor-pointer">${isOpen ? '收合' : '展開'}</button>` : ''} <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="ml-1 text-xs text-sky-600 hover:underline">[${escapeHtml(item.source)}]</a></td>
              </tr>`;
            }).join(''));
          }
        } else {
          if (showCo) out += `<div class="space-y-2">${f.co.map((item, idx) => renderExpandableCard(`${r.id}-c-co-${idx}`, `<div class="flex items-center justify-between gap-2 flex-wrap"><span class="font-bold text-slate-900 text-sm">${item.watchlist ? '<span class="text-amber-500 mr-1">★</span>' : ''}${highlightText(item.name, q)} <span class="text-xs font-normal text-slate-500">${highlightText(item.ticker, q)}</span></span><span class="text-xs"><span class="font-semibold">${escapeHtml(item.price)}</span> <span class="${changeColor(item.change)}">${escapeHtml(item.change)}</span> <span class="text-slate-400">${escapeHtml(item.date)}</span></span></div>`, `<p>${highlightText(item.summary, q)}</p><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="inline-block mt-2 text-xs font-semibold text-sky-600 hover:underline">查看來源（${escapeHtml(item.source)}）→</a>`)).join('')}</div>`;
          if (showReg) out += `<div class="space-y-2">${f.reg.map((item, idx) => renderExpandableCard(`${r.id}-c-reg-${idx}`, `<div class="flex items-center justify-between gap-2"><div class="flex items-center gap-2 min-w-0"><span class="px-2 py-0.5 rounded text-xs font-bold ${agencyBadgeClass(item.agency)} shrink-0">${escapeHtml(item.agency)}</span><span class="font-bold text-slate-900 text-sm truncate">${highlightText(item.title, q)}</span></div><span class="text-xs text-slate-400 shrink-0">${escapeHtml(item.date)}</span></div>`, `<p>${highlightText(item.detail, q)}</p><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="inline-block mt-2 text-xs font-semibold text-sky-600 hover:underline">查看來源（${escapeHtml(item.source)}）→</a>`)).join('')}</div>`;
          if (showCat) out += `<div class="space-y-2">${f.cat.map((item, idx) => renderExpandableCard(`${r.id}-c-cat-${idx}`, `<div class="flex items-center justify-between gap-2 flex-wrap"><span class="font-bold text-slate-900 text-sm">${highlightText(item.asset, q)} · <span class="text-xs font-normal text-slate-500">${escapeHtml(item.type)}</span></span><span class="px-2 py-0.5 rounded-full text-[11px] font-semibold border ${outcomeBadge(item.outcome)}">${escapeHtml(item.outcome)}</span></div>`, `<p>${highlightText(item.note, q)}</p><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="inline-block mt-2 text-xs font-semibold text-sky-600 hover:underline">查看來源（${escapeHtml(item.source)}）→</a>`)).join('')}</div>`;
          if (showDeep) out += `<div class="space-y-2">${f.deep.map((item, idx) => renderExpandableCard(`${r.id}-c-deep-${idx}`, `<div class="flex items-center gap-2"><span class="px-2 py-0.5 rounded text-[11px] font-bold ${deepCatClass(item.cat)} shrink-0">${escapeHtml(item.cat)}</span><span class="font-bold text-slate-900 text-sm truncate">${highlightText(item.title, q)}</span></div>`, `<p>${highlightText(item.body, q)}</p><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="inline-block mt-2 text-xs font-semibold text-sky-600 hover:underline">閱讀來源（${escapeHtml(item.source)}）→</a>`)).join('')}</div>`;
        }
        return out;
      };

      if (q && state.crossDateSearch) {
        let html = '';
        state.reports.forEach(r => { html += renderBlocks(r, filterRep(r), true); });
        $('swipeContainer').innerHTML = html || `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-sm text-slate-500">無符合「${escapeHtml(q)}」的跨期日報內容。</div>`;
      } else {
        $('swipeContainer').innerHTML = renderBlocks(rep, filterRep(rep), false) || `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-sm text-slate-500">本期無符合篩選條件的項目。</div>`;
      }
    }

    function renderSection2() {
      const q = state.searchQuery.trim().toLowerCase();
      let list = DEEP_ANALYSES.filter(d => withinDays(d.date, state.periodDays) && (!q || `${d.cat} ${d.title} ${d.fact} ${d.background} ${d.impact} ${d.companies.join(' ')}`.toLowerCase().includes(q)));
      if (state.sec2Sort === 'cat') list.sort((a, b) => a.cat.localeCompare(b.cat));
      else list.sort((a, b) => b.date.localeCompare(a.date));

      $('sec2Content').innerHTML = list.length ? list.map(d => renderExpandableCard(
        `sec2-${d.id}`,
        `<div class="flex items-center justify-between gap-2 flex-wrap">
          <div class="flex items-center gap-2 min-w-0">
            <span class="px-2 py-0.5 rounded text-[11px] font-bold ${deepCatClass(d.cat)} shrink-0">${escapeHtml(d.cat)}</span>
            <span class="font-bold text-slate-900 text-sm truncate">${highlightText(d.title, q)}</span>
          </div>
          <span class="text-xs text-slate-400 shrink-0">${escapeHtml(d.date)}</span>
        </div>`,
        `<div class="space-y-2">
          <div><span class="font-semibold text-slate-900">事實：</span>${highlightText(d.fact, q)}</div>
          <div><span class="font-semibold text-slate-900">背景：</span>${highlightText(d.background, q)}</div>
          <div><span class="font-semibold text-slate-900">影響：</span>${highlightText(d.impact, q)}</div>
          <div><span class="font-semibold text-slate-900">趨勢預測：</span>${highlightText(d.forecast, q)}</div>
          <div class="pt-1 flex items-center justify-between flex-wrap gap-2">
            <span class="text-xs text-slate-500">相關業者：${d.companies.map(c => `<span class="inline-block px-2 py-0.5 rounded bg-white border border-slate-200 text-slate-700 mr-1">${escapeHtml(c)}</span>`).join('')}</span>
            <a href="${escapeHtml(d.url)}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-sky-600 hover:underline">查看來源（${escapeHtml(d.source)}）→</a>
          </div>
        </div>`
      )).join('') : `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-sm text-slate-500">此時間區間或搜尋條件下無深度解析項目。</div>`;
    }

    function renderSection3() {
      const q = state.searchQuery.trim().toLowerCase();
      let list = REG_UPDATES.filter(r => withinDays(r.date, state.periodDays) && (state.activeAgency === 'all' || r.agency === state.activeAgency) && (!q || `${r.agency} ${r.title} ${r.detail} ${r.source}`.toLowerCase().includes(q)));
      if (state.sec3Sort === 'agency') list.sort((a, b) => a.agency.localeCompare(b.agency));
      else list.sort((a, b) => b.date.localeCompare(a.date));

      $('sec3Content').innerHTML = list.length ? list.map(r => renderExpandableCard(
        `sec3-${r.id}`,
        `<div class="flex items-center justify-between gap-2 flex-wrap">
          <div class="flex items-center gap-2 min-w-0">
            <span class="px-2 py-0.5 rounded text-xs font-bold ${agencyBadgeClass(r.agency)} shrink-0">${escapeHtml(r.agency)}</span>
            <span class="font-bold text-slate-900 text-sm truncate">${highlightText(r.title, q)}</span>
          </div>
          <span class="text-xs text-slate-400 shrink-0">${escapeHtml(r.date)}</span>
        </div>`,
        `<p>${highlightText(r.detail, q)}</p><a href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer" class="inline-block mt-2 text-xs font-semibold text-sky-600 hover:underline">查看來源（${escapeHtml(r.source)}）→</a>`
      )).join('') : `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-sm text-slate-500">此區間無符合條件的藥監動態。</div>`;
    }

    function renderSection4() {
      const q = state.searchQuery.trim().toLowerCase();
      let list = COMPANIES.filter(c => (!state.watchlistOnly || c.watchlist) && (!q || `${c.ticker} ${c.name} ${c.market} ${c.events.join(' ')}`.toLowerCase().includes(q)));
      if (state.sec4Sort === 'change') list.sort((a, b) => b.change - a.change);

      const renderGroup = (title, items, isWatch) => items.length ? `
        <div class="space-y-2">
          <h3 class="text-xs font-bold uppercase tracking-wider ${isWatch ? 'text-amber-700' : 'text-slate-500'}">${title}（${items.length}）</h3>
          <div class="space-y-2">
            ${items.map(c => renderExpandableCard(
              `sec4-${c.ticker}`,
              `<div class="flex items-center justify-between gap-2 flex-wrap">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-slate-900 text-sm">${c.watchlist ? '<span class="text-amber-500 mr-1">★</span>' : ''}${highlightText(c.name, q)}</span>
                  <span class="text-xs font-mono text-slate-500">${highlightText(c.ticker, q)}</span>
                  <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-100 text-slate-600">${escapeHtml(c.market)}</span>
                </div>
                <div class="flex items-center gap-2 text-xs">
                  <span class="font-semibold text-slate-900">${escapeHtml(c.price)}</span>
                  <span class="${changeColor(c.changeText)}">${escapeHtml(c.changeText)}</span>
                  <span class="text-slate-400">${escapeHtml(c.date)}</span>
                </div>
              </div>`,
              `<ul class="list-disc pl-5 space-y-1">${c.events.map(ev => `<li>${highlightText(ev, q)}</li>`).join('')}</ul>
               <div class="mt-2.5 flex items-center gap-3 text-xs">
                 <a href="${escapeHtml(c.yahoo)}" target="_blank" rel="noopener noreferrer" class="font-semibold text-sky-600 hover:underline">Yahoo Finance ↗</a>
                 <a href="${escapeHtml(c.google)}" target="_blank" rel="noopener noreferrer" class="font-semibold text-sky-600 hover:underline">Google Finance ↗</a>
               </div>`,
              isWatch ? 'bg-amber-50/40 border-amber-200' : 'bg-white'
            )).join('')}
          </div>
        </div>` : '';

      if (state.sec4Sort === 'group') {
        const watch = list.filter(c => c.watchlist), others = list.filter(c => !c.watchlist);
        $('sec4Content').innerHTML = (renderGroup('★ 指定重點關注標的', watch, true) + renderGroup('全球主要生醫業者', others, false)) || `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-sm text-slate-500">無符合條件的業者。</div>`;
      } else {
        $('sec4Content').innerHTML = renderGroup('依漲跌幅排序', list, false) || `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-sm text-slate-500">無符合條件的業者。</div>`;
      }
    }

    function renderRelatedTopics() {
      const rep = state.reports[state.currentIndex];
      $('relatedTopicsBar').innerHTML = rep.topics.map(t => {
        const active = state.searchQuery.trim().toLowerCase() === t.toLowerCase();
        return `<button data-topic="${escapeHtml(t)}" type="button" class="topic-chip px-2.5 py-1 rounded-full text-xs font-medium border transition cursor-pointer ${active ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-sky-50'}">${escapeHtml(t)}</button>`;
      }).join('');
    }

    function renderAutocomplete() {
      const q = $('searchInput').value.trim().toLowerCase();
      const box = $('autocompleteList');
      if (!q) { box.classList.add('hidden'); return; }
      const map = new Map();
      state.reports[state.currentIndex].topics.forEach(t => map.set(t.toLowerCase(), { label: t, group: '主題' }));
      COMPANIES.forEach(c => { map.set(c.ticker.toLowerCase(), { label: c.ticker, group: '代號' }); map.set(c.name.toLowerCase(), { label: c.name, group: '公司' }); });
      REG_UPDATES.forEach(r => map.set(r.agency.toLowerCase(), { label: r.agency, group: '藥監' }));
      const items = Array.from(map.values()).filter(i => i.label.toLowerCase().includes(q)).slice(0, 6);
      if (!items.length) { box.classList.add('hidden'); return; }
      box.innerHTML = items.map(i => `<button type="button" data-suggest="${escapeHtml(i.label)}" class="suggest-item w-full text-left px-3.5 py-2 hover:bg-sky-50 flex items-center justify-between text-xs sm:text-sm cursor-pointer"><span class="font-medium text-slate-800">${highlightText(i.label, q)}</span><span class="text-[11px] px-2 py-0.5 rounded bg-slate-100 text-slate-500">${escapeHtml(i.group)}</span></button>`).join('');
      box.classList.remove('hidden');
    }

    function render() {
      const isTable = state.viewMode === 'table';
      $('btnViewTable').className = `inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer ${isTable ? 'bg-sky-500 text-white' : 'text-slate-300 hover:text-white'}`;
      $('btnViewCard').className = `inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer ${!isTable ? 'bg-sky-500 text-white' : 'text-slate-300 hover:text-white'}`;

      ['1', '2', '3', '4'].forEach(s => {
        const show = state.visibleSection === 'all' || state.visibleSection === s;
        $(`sec${s}Container`).classList.toggle('hidden', !show);
      });

      const hasFilter = Boolean(state.searchQuery.trim() || state.watchlistOnly || state.activeAgency !== 'all');
      $('searchStatusBanner').classList.toggle('hidden', !hasFilter);
      if (hasFilter) {
        $('searchStatusText').textContent = `目前篩選｜期間：近 ${state.periodDays} 天${state.searchQuery.trim() ? `｜關鍵字：${state.searchQuery.trim()}` : ''}${state.watchlistOnly ? '｜僅看關注股' : ''}${state.activeAgency !== 'all' ? `｜藥監：${state.activeAgency}` : ''}`;
      }

      renderRelatedTopics();
      renderSection1();
      renderSection2();
      renderSection3();
      renderSection4();
      if (window.lucide) lucide.createIcons();
    }

    function switchEdition(newIdx, dir) {
      if (newIdx < 0 || newIdx >= state.reports.length || newIdx === state.currentIndex) return;
      const el = $('swipeContainer');
      el.classList.add(dir === 'left' ? 'swipe-left' : 'swipe-right');
      setTimeout(() => { state.currentIndex = newIdx; render(); el.classList.remove('swipe-left', 'swipe-right'); }, 130);
    }

    // Listeners
    $('btnViewTable').addEventListener('click', () => { state.viewMode = 'table'; render(); });
    $('btnViewCard').addEventListener('click', () => { state.viewMode = 'card'; render(); });
    $('btnPrevDate').addEventListener('click', () => switchEdition(state.currentIndex - 1, 'right'));
    $('btnNextDate').addEventListener('click', () => switchEdition(state.currentIndex + 1, 'left'));

    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.periodDays = Number(btn.dataset.days);
        document.querySelectorAll('.period-btn').forEach(b => {
          const a = Number(b.dataset.days) === state.periodDays;
          b.className = `period-btn px-2.5 py-1 rounded-md font-medium cursor-pointer shrink-0 ${a ? 'bg-sky-500 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`;
        });
        render();
      });
    });

    document.querySelectorAll('.sec-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.visibleSection = btn.dataset.sec;
        document.querySelectorAll('.sec-btn').forEach(b => {
          const a = b.dataset.sec === state.visibleSection;
          b.className = `sec-btn px-2.5 py-1 rounded-md font-medium cursor-pointer shrink-0 ${a ? 'bg-sky-500 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`;
        });
        render();
      });
    });

    $('datePills').addEventListener('click', (e) => {
      const btn = e.target.closest('.date-pill');
      if (!btn) return;
      const idx = Number(btn.dataset.idx);
      switchEdition(idx, idx > state.currentIndex ? 'left' : 'right');
    });

    document.querySelector('main').addEventListener('click', (e) => {
      const btn = e.target.closest('.expand-btn');
      if (!btn) return;
      const key = btn.dataset.toggle;
      state.expandedIds[key] = !state.expandedIds[key];
      render();
    });

    $('searchInput').addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      $('btnClearSearch').classList.toggle('hidden', !state.searchQuery);
      renderAutocomplete();
      render();
    });

    $('btnClearSearch').addEventListener('click', () => {
      $('searchInput').value = ''; state.searchQuery = '';
      $('btnClearSearch').classList.add('hidden'); $('autocompleteList').classList.add('hidden');
      render();
    });

    $('autocompleteList').addEventListener('click', (e) => {
      const btn = e.target.closest('.suggest-item');
      if (!btn) return;
      $('searchInput').value = btn.dataset.suggest; state.searchQuery = btn.dataset.suggest;
      $('btnClearSearch').classList.remove('hidden'); $('autocompleteList').classList.add('hidden');
      render();
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchInput') && !e.target.closest('#autocompleteList')) $('autocompleteList').classList.add('hidden');
    });

    $('relatedTopicsBar').addEventListener('click', (e) => {
      const btn = e.target.closest('.topic-chip');
      if (!btn) return;
      const t = btn.dataset.topic;
      state.searchQuery = state.searchQuery.trim().toLowerCase() === t.toLowerCase() ? '' : t;
      $('searchInput').value = state.searchQuery;
      $('btnClearSearch').classList.toggle('hidden', !state.searchQuery);
      render();
    });

    $('btnSearchScope').addEventListener('click', () => {
      state.crossDateSearch = !state.crossDateSearch;
      $('searchScopeLabel').textContent = state.crossDateSearch ? '跨期搜尋' : '單期搜尋';
      $('btnSearchScope').classList.toggle('bg-sky-50', state.crossDateSearch);
      $('btnSearchScope').classList.toggle('border-sky-300', state.crossDateSearch);
      render();
    });

    $('btnWatchlistOnly').addEventListener('click', () => {
      state.watchlistOnly = !state.watchlistOnly;
      $('btnWatchlistOnly').classList.toggle('bg-amber-50', state.watchlistOnly);
      $('btnWatchlistOnly').classList.toggle('border-amber-300', state.watchlistOnly);
      render();
    });

    $('moduleTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.mod-tab');
      if (!btn) return;
      state.activeModule = btn.dataset.mod;
      document.querySelectorAll('.mod-tab').forEach(b => {
        const a = b.dataset.mod === state.activeModule;
        b.className = `mod-tab px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0 ${a ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'}`;
      });
      render();
    });

    $('agencyChips').addEventListener('click', (e) => {
      const btn = e.target.closest('.agency-chip');
      if (!btn) return;
      state.activeAgency = btn.dataset.agency;
      document.querySelectorAll('.agency-chip').forEach(b => {
        const a = b.dataset.agency === state.activeAgency;
        b.className = `agency-chip px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer shrink-0 ${a ? 'bg-sky-100 text-sky-800' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
      });
      render();
    });

    $('btnResetFilters').addEventListener('click', () => {
      $('searchInput').value = ''; state.searchQuery = ''; state.watchlistOnly = false; state.activeAgency = 'all';
      $('btnClearSearch').classList.add('hidden'); $('btnWatchlistOnly').classList.remove('bg-amber-50', 'border-amber-300');
      render();
    });

    $('sec2Sort').addEventListener('change', (e) => { state.sec2Sort = e.target.value; renderSection2(); if (window.lucide) lucide.createIcons(); });
    $('sec3Sort').addEventListener('change', (e) => { state.sec3Sort = e.target.value; renderSection3(); if (window.lucide) lucide.createIcons(); });
    $('sec4Sort').addEventListener('change', (e) => { state.sec4Sort = e.target.value; renderSection4(); if (window.lucide) lucide.createIcons(); });

    let sx = 0, sy = 0;
    $('swipeContainer').addEventListener('touchstart', (e) => { sx = e.changedTouches[0].screenX; sy = e.changedTouches[0].screenY; }, { passive: true });
    $('swipeContainer').addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - sx, dy = e.changedTouches[0].screenY - sy;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) switchEdition(state.currentIndex + (dx < 0 ? 1 : -1), dx < 0 ? 'left' : 'right');
    }, { passive: true });

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === $('searchInput')) return;
      if (e.key === 'ArrowLeft') switchEdition(state.currentIndex - 1, 'right');
      if (e.key === 'ArrowRight') switchEdition(state.currentIndex + 1, 'left');
    });


    async function tryLoadRemoteJson() {
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        try {
          const res = await fetch('./data/reports_index.json', { cache: 'no-store' });
          if (res.ok) {
            const remote = await res.json();
            if (Array.isArray(remote) && remote.length > 0) {
              const mergedMap = new Map();
              REPORTS_DATA.forEach(r => mergedMap.set(r.id, r));
              remote.forEach(r => {
                if (r && r.id && Array.isArray(r.co)) mergedMap.set(r.id, r);
              });
              state.reports = Array.from(mergedMap.values()).sort((a, b) => String(b.id).localeCompare(String(a.id)));
              state.currentIndex = 0;
              render();
            }
          }
        } catch (_) { /* Fallback to embedded data */ }
      }
    }

    render();
    tryLoadRemoteJson();
  </script>
</body>
</html>
