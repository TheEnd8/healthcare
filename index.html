    function calcStartDate(endStr, days) {
      const end = new Date(endStr + 'T00:00:00');
      end.setDate(end.getDate() - Math.max(0, days - 1));
      return end.toISOString().slice(0, 10);
    }

    function loadPrefs() {
      const defaults = {
        theme: 'vibrant',
        viewMode: window.innerWidth < 640 ? 'card' : 'table',
        periodDays: 7,
        startDate: calcStartDate(TODAY_STR, 7),
        endDate: TODAY_STR,
        visibleSection: 'all',
        crossDateSearch: true,
        watchlistOnly: false,
        activeModule: 'all',
        activeAgency: 'all',
        sec2Sort: 'date',
        sec3Sort: 'agency',
        sec4Sort: 'group'
      };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaults;
        return Object.assign(defaults, JSON.parse(raw));
      } catch (_) {
        return defaults;
      }
    }

    function savePrefs() {
      try {
        const toSave = {
          theme: state.theme, viewMode: state.viewMode, periodDays: state.periodDays,
          startDate: state.startDate, endDate: state.endDate, visibleSection: state.visibleSection,
          crossDateSearch: state.crossDateSearch, watchlistOnly: state.watchlistOnly,
          activeModule: state.activeModule, activeAgency: state.activeAgency,
          sec2Sort: state.sec2Sort, sec3Sort: state.sec3Sort, sec4Sort: state.sec4Sort
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      } catch (_) {}
    }

    const prefs = loadPrefs();

      reports: REPORTS_DATA,
      currentIndex: 0,

    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function highlightText(text, query) {
      const safe = escapeHtml(text);
      if (!query.trim()) return safe;
      const escapedQ = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp(`(${escapedQ})`, 'gi'), '<mark>$1</mark>');
    }

    function normDate(str) {
      const m = String(str || '').match(/(\d{4})[\/-](\d{2})[\/-](\d{2})/);
      return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
    }

    function isInDateRange(dateStr) {
      const d = normDate(dateStr);
      if (!d) return true;
      return d >= state.startDate && d <= state.endDate;
    }

    function hasRealUpdate(text) {
      const t = String(text || '');
      return !(t.includes('持穩無重大新增') || t.includes('無新增藥證') || t.includes('無新藥證增量'));
    }

    function changeColor(chg) {
      if (String(chg).includes('▲')) return 'text-rose-600 font-semibold';
      if (String(chg).includes('▼')) return 'text-emerald-600 font-semibold';
      return 'text-slate-500';
    }

    function outcomeBadge(outcome) {
      if (outcome.includes('優於預期')) return 'bg-emerald-100 text-emerald-800 border-emerald-200';
      if (outcome.includes('低於預期')) return 'bg-rose-100 text-rose-800 border-rose-200';
      if (outcome.includes('符合預期')) return 'bg-sky-100 text-sky-800 border-sky-200';
      return 'bg-amber-100 text-amber-800 border-amber-200';
    }

    function getMultiDayAggregatedReport() {
      const matching = state.reports.filter(r => isInDateRange(r.date));
      const sourceList = matching.length ? matching : [state.reports[state.currentIndex]];
      const isMulti = state.periodDays !== 1 && sourceList.length > 1;

      if (!isMulti) {
        const single = state.reports[state.currentIndex];
        return { isMulti: false, count: 1, rep: single };
      }

      const dedupSort = (arr, keyFn) => {
        const seen = new Map();
        arr.forEach(item => {
          const k = keyFn(item).toLowerCase();
          if (!seen.has(k)) seen.set(k, item);
        });
        return Array.from(seen.values()).sort((a, b) => {
          const impDiff = (b.importance || 3) - (a.importance || 3);
          if (impDiff !== 0) return impDiff;
          return String(b.date || '').localeCompare(String(a.date || ''));
        });
      };

      const coAll = [], regAll = [], catAll = [], deepAll = [], topicsSet = new Set();
      sourceList.forEach(r => {
        r.co.filter(i => hasRealUpdate(i.summary)).forEach(i => coAll.push(i));
        r.reg.filter(i => hasRealUpdate(i.detail)).forEach(i => regAll.push(i));
        r.cat.forEach(i => catAll.push(i));
        r.deep.forEach(i => deepAll.push(i));
        (r.topics || []).forEach(t => topicsSet.add(t));
      });

      return {
        isMulti: true,
        count: sourceList.length,
        rep: {
          id: 'multi',
          date: `${state.startDate.replace(/-/g, '/')} – ${state.endDate.replace(/-/g, '/')}`,
          session: `精選彙整 (${sourceList.length} 期)`,

          topics: Array.from(topicsSet).slice(0, 7),
          co: dedupSort(coAll, i => i.ticker || i.name),
          reg: dedupSort(regAll, i => `${i.agency}-${i.title}`),
          cat: dedupSort(catAll, i => i.asset),
          deep: dedupSort(deepAll, i => i.title)
        }
      };

        $('sec3Content').innerHTML = renderCardGrid(list.map(r => renderExpandableCard(
          `sec3-${r.id}`,
          `<div class="space-y-1"><div class="flex items-center justify-between gap-2"><span class="px-2 py-0.5 rounded text-xs font-bold ${agencyBadgeClass(r.agency)}">${escapeHtml(r.agency)}</span><span class="text-xs text-slate-400">${escapeHtml(r.date)}</span></div><div class="font-bold text-slate-900 text-sm line-clamp-2">${highlightText(r.title, q)}</div></div>`,
          `<p>${highlightText(r.detail, q)}</p>${r.analysis ? `<div class="p-2 rounded-lg bg-violet-50 border border-violet-200 text-xs"><b>監管解讀：</b>${highlightText(r.analysis, q)}</div>` : ''}<a href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer" class="inline-block text-xs font-semibold text-sky-600 hover:underline">查看來源（${escapeHtml(r.source)}）→</a>`,
          'bg-white border-t-4 border-t-violet-500'
        )).join(''));
      }
    }

    function renderSection4() {
      const q = state.searchQuery.trim().toLowerCase();
      let list = COMPANIES.filter(c => (!state.watchlistOnly || c.watchlist) && (!q || `${c.ticker} ${c.name} ${c.market} ${c.events.join(' ')} ${c.analysis || ''}`.toLowerCase().includes(q)));
      if (state.sec4Sort === 'change') list.sort((a, b) => b.change - a.change);
      else list.sort((a, b) => Number(b.watchlist) - Number(a.watchlist));

      if (!list.length) {
        $('sec4Content').innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-sm text-slate-500">無符合條件的業者。</div>`;
        return;
      }

      if (state.viewMode === 'table') {
        $('sec4Content').innerHTML = renderTableBlock('主要業者與重點關注標的', 'bg-emerald-500', 'bg-emerald-50/80', ['公司 / 代號', '市場', '最新股價', '日期', '最新動態與評價短評'], list.map(c => {
          const key = `s4-t-${c.ticker}`, isOpen = Boolean(state.expandedIds[key]);
          return `<tr class="hover:bg-slate-50/80 ${c.watchlist ? 'bg-amber-50/35' : ''}">
            <td class="py-2.5 px-3 align-top whitespace-nowrap font-bold text-slate-900">${c.watchlist ? '<span class="text-amber-500 mr-1">★</span>' : ''}${highlightText(c.name, q)} <span class="text-xs font-mono text-slate-500">${highlightText(c.ticker, q)}</span></td>
            <td class="py-2.5 px-3 align-top whitespace-nowrap"><span class="px-1.5 py-0.5 rounded text-[11px] bg-slate-100 text-slate-600">${escapeHtml(c.market)}</span></td>
            <td class="py-2.5 px-3 align-top whitespace-nowrap"><span class="font-medium">${escapeHtml(c.price)}</span> <span class="text-xs ${changeColor(c.changeText)}">${escapeHtml(c.changeText)}</span></td>
            <td class="py-2.5 px-3 align-top whitespace-nowrap text-xs text-slate-500">${escapeHtml(c.date)}</td>
            <td class="py-2.5 px-3 align-top text-slate-700 min-w-0">
              <div>${highlightText(c.events[0], q)} <button type="button" data-toggle="${key}" class="expand-btn ml-1 text-xs font-semibold text-emerald-700 hover:underline cursor-pointer">${isOpen ? '收合' : '展開短評'}</button></div>
              ${isOpen ? `<div class="mt-2 p-2.5 rounded-lg bg-emerald-50/70 border border-emerald-200 text-xs space-y-1.5"><ul class="list-disc pl-4">${c.events.map(ev => `<li>${highlightText(ev, q)}</li>`).join('')}</ul><div><b>評價短評：</b>${highlightText(c.analysis || '', q)}</div><div class="flex gap-3 pt-1"><a href="${escapeHtml(c.yahoo)}" target="_blank" rel="noopener noreferrer" class="text-sky-600 font-semibold hover:underline">Yahoo Finance ↗</a><a href="${escapeHtml(c.google)}" target="_blank" rel="noopener noreferrer" class="text-sky-600 font-semibold hover:underline">Google Finance ↗</a></div></div>` : ''}
            </td>
          </tr>`;
        }).join(''));
      } else {
        $('sec4Content').innerHTML = renderCardGrid(list.map(c => renderExpandableCard(
          `sec4-${c.ticker}`,
          `<div class="space-y-1">
            <div class="flex items-center justify-between gap-2">
              <span class="font-bold text-slate-900 text-sm truncate">${c.watchlist ? '<span class="text-amber-500 mr-1">★</span>' : ''}${highlightText(c.name, q)}</span>
              <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-100 text-slate-600 shrink-0">${escapeHtml(c.market)}</span>
            </div>
            <div class="flex items-center justify-between gap-2 text-xs">
              <span class="font-mono text-slate-500">${highlightText(c.ticker, q)}</span>
              <span><span class="font-semibold text-slate-800">${escapeHtml(c.price)}</span> <span class="${changeColor(c.changeText)}">${escapeHtml(c.changeText)}</span></span>
            </div>
            <div class="text-xs text-slate-600 line-clamp-2">${highlightText(c.events[0], q)}</div>
          </div>`,
          `<ul class="list-disc pl-4 space-y-1">${c.events.map(ev => `<li>${highlightText(ev, q)}</li>`).join('')}</ul>
           ${c.analysis ? `<div class="p-2 rounded-lg bg-emerald-50 border border-emerald-200 text-xs"><b>評價短評：</b>${highlightText(c.analysis, q)}</div>` : ''}
           <div class="flex gap-3 text-xs pt-1"><a href="${escapeHtml(c.yahoo)}" target="_blank" rel="noopener noreferrer" class="font-semibold text-sky-600 hover:underline">Yahoo Finance ↗</a><a href="${escapeHtml(c.google)}" target="_blank" rel="noopener noreferrer" class="font-semibold text-sky-600 hover:underline">Google Finance ↗</a></div>`,
          c.watchlist ? 'bg-amber-50/60 border-t-4 border-t-amber-500' : 'bg-white border-t-4 border-t-emerald-500'
        )).join(''));
      }
    }

    function renderRelatedTopics() {
      const agg = getMultiDayAggregatedReport();
      $('relatedTopicsBar').innerHTML = (agg.rep.topics || []).map(t => {
        const active = state.searchQuery.trim().toLowerCase() === t.toLowerCase();
        return `<button data-topic="${escapeHtml(t)}" type="button" class="topic-chip px-2.5 py-1 rounded-full text-xs font-medium border transition cursor-pointer ${active ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-sky-50'}">${escapeHtml(t)}</button>`;
      }).join('');
    }

    function renderAutocomplete() {
      const q = $('searchInput').value.trim().toLowerCase();
      const box = $('autocompleteList');
      if (!q) { box.classList.add('hidden'); return; }
      const map = new Map();
      state.reports[state.currentIndex].topics.forEach(t => map.set(t.toLowerCase(), { label: t, group: '主題' }));
      COMPANIES.forEach(c => { map.set(c.ticker.toLowerCase(), { label: c.ticker, group: '代號' }); map.set(c.name.toLowerCase(), { label: c.name, group: '公司' }); });
      REG_UPDATES.forEach(r => map.set(r.agency.toLowerCase(), { label: r.agency, group: '藥監' }));
      const items = Array.from(map.values()).filter(i => i.label.toLowerCase().includes(q)).slice(0, 6);
      if (!items.length) { box.classList.add('hidden'); return; }
      box.innerHTML = items.map(i => `<button type="button" data-suggest="${escapeHtml(i.label)}" class="suggest-item w-full text-left px-3.5 py-2 hover:bg-sky-50 flex items-center justify-between text-xs sm:text-sm cursor-pointer"><span class="font-medium text-slate-800">${highlightText(i.label, q)}</span><span class="text-[11px] px-2 py-0.5 rounded bg-slate-100 text-slate-500">${escapeHtml(i.group)}</span></button>`).join('');
      box.classList.remove('hidden');
    }

    function syncControlHighlights() {
      const isTable = state.viewMode === 'table';
      $('btnViewTable').className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer ${isTable ? 'bg-sky-500 text-white' : 'text-slate-200 hover:text-white'}`;
      $('btnViewCard').className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer ${!isTable ? 'bg-sky-500 text-white' : 'text-slate-200 hover:text-white'}`;

      document.querySelectorAll('.period-btn').forEach(b => {
        const a = Number(b.dataset.days) === state.periodDays;
        b.className = `period-btn px-2 py-1 rounded-md font-medium cursor-pointer shrink-0 ${a ? 'bg-sky-500 text-white' : 'bg-white/10 text-slate-200 hover:bg-white/20'}`;
      });
      $('startDateInput').value = state.startDate;
      $('endDateInput').value = state.endDate;

      document.querySelectorAll('.sec-btn').forEach(b => {
        const a = b.dataset.sec === state.visibleSection;
        b.className = `sec-btn px-2.5 py-1 rounded-md font-medium cursor-pointer shrink-0 ${a ? 'bg-sky-500 text-white' : 'bg-white/10 text-slate-200 hover:bg-white/20'}`;
      });

      document.querySelectorAll('.mod-tab').forEach(b => {
        const a = b.dataset.mod === state.activeModule;
        b.className = `mod-tab px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0 ${a ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'}`;
      });

      document.querySelectorAll('.agency-chip').forEach(b => {
        const a = b.dataset.agency === state.activeAgency;
        b.className = `agency-chip px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer shrink-0 ${a ? 'bg-sky-100 text-sky-800' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
      });

      $('btnWatchlistOnly').classList.toggle('bg-amber-50', state.watchlistOnly);
      $('btnWatchlistOnly').classList.toggle('border-amber-300', state.watchlistOnly);
      $('sec2Sort').value = state.sec2Sort;
      $('sec3Sort').value = state.sec3Sort;
      $('sec4Sort').value = state.sec4Sort;
    }

    function render() {
      applyTheme();
      syncControlHighlights();

      ['1', '2', '3', '4'].forEach(s => {
        $(`sec${s}Container`).classList.toggle('hidden', !(state.visibleSection === 'all' || state.visibleSection === s));
      });

      const hasFilter = Boolean(state.searchQuery.trim() || state.watchlistOnly || state.activeAgency !== 'all');
      $('searchStatusBanner').classList.toggle('hidden', !hasFilter);
      if (hasFilter) {
        $('searchStatusText').textContent = `篩選中｜區間：${state.startDate} ～ ${state.endDate}${state.searchQuery.trim() ? `｜關鍵字：${state.searchQuery.trim()}` : ''}${state.watchlistOnly ? '｜僅看關注股' : ''}${state.activeAgency !== 'all' ? `｜藥監：${state.activeAgency}` : ''}`;
      }

      renderRelatedTopics();
      renderSection1();
      renderSection2();
      renderSection3();
      renderSection4();
      savePrefs();
      if (window.lucide) lucide.createIcons();
    }

    function switchEdition(newIdx, dir) {
      if (newIdx < 0 || newIdx >= state.reports.length) return;
      state.periodDays = 1;
      const d = normDate(state.reports[newIdx].date) || TODAY_STR;
      state.startDate = d;
      state.endDate = d;
      const el = $('swipeContainer');
      el.classList.add(dir === 'left' ? 'swipe-left' : 'swipe-right');
      setTimeout(() => { state.currentIndex = newIdx; render(); el.classList.remove('swipe-left', 'swipe-right'); }, 130);
    }

    // Event Listeners
    $('themeSelect').addEventListener('change', (e) => { state.theme = e.target.value; render(); });
    $('btnViewTable').addEventListener('click', () => { state.viewMode = 'table'; render(); });
    $('btnViewCard').addEventListener('click', () => { state.viewMode = 'card'; render(); });
    $('btnPrevDate').addEventListener('click', () => switchEdition(state.currentIndex - 1, 'right'));
    $('btnNextDate').addEventListener('click', () => switchEdition(state.currentIndex + 1, 'left'));

    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.periodDays = Number(btn.dataset.days);
        state.endDate = TODAY_STR;
        state.startDate = calcStartDate(TODAY_STR, state.periodDays);
        render();
      });
    });

    $('startDateInput').addEventListener('change', (e) => {
      if (!e.target.value) return;
      state.periodDays = 0;
      state.startDate = e.target.value;
      if (state.startDate > state.endDate) state.endDate = state.startDate;
      render();
    });

    $('endDateInput').addEventListener('change', (e) => {
      if (!e.target.value) return;
      state.periodDays = 0;
      state.endDate = e.target.value;
      if (state.endDate < state.startDate) state.startDate = state.endDate;
      render();
    });

    document.querySelectorAll('.sec-btn').forEach(btn => {
      btn.addEventListener('click', () => { state.visibleSection = btn.dataset.sec; render(); });
    });

    $('datePills').addEventListener('click', (e) => {
      const btn = e.target.closest('.date-pill');
      if (!btn) return;
      const idx = Number(btn.dataset.idx);
      switchEdition(idx, idx > state.currentIndex ? 'left' : 'right');
    });

    document.querySelector('main').addEventListener('click', (e) => {
      const btn = e.target.closest('.expand-btn');
      if (!btn) return;
      e.preventDefault();
      const scrollY = window.scrollY;
      const key = btn.dataset.toggle;
      state.expandedIds[key] = !state.expandedIds[key];
      render();
      window.scrollTo(0, scrollY);
    });

    $('searchInput').addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      $('btnClearSearch').classList.toggle('hidden', !state.searchQuery);
      renderAutocomplete();
      render();
    });

    $('btnClearSearch').addEventListener('click', () => {
      $('searchInput').value = ''; state.searchQuery = '';
      $('btnClearSearch').classList.add('hidden'); $('autocompleteList').classList.add('hidden');
      render();
    });

    $('autocompleteList').addEventListener('click', (e) => {
      const btn = e.target.closest('.suggest-item');
      if (!btn) return;
      $('searchInput').value = btn.dataset.suggest; state.searchQuery = btn.dataset.suggest;
      $('btnClearSearch').classList.remove('hidden'); $('autocompleteList').classList.add('hidden');
      render();
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchInput') && !e.target.closest('#autocompleteList')) $('autocompleteList').classList.add('hidden');
    });

    $('relatedTopicsBar').addEventListener('click', (e) => {
      const btn = e.target.closest('.topic-chip');
      if (!btn) return;
      const t = btn.dataset.topic;
      state.searchQuery = state.searchQuery.trim().toLowerCase() === t.toLowerCase() ? '' : t;
      $('searchInput').value = state.searchQuery;
      $('btnClearSearch').classList.toggle('hidden', !state.searchQuery);
      render();
    });

    $('btnSearchScope').addEventListener('click', () => {
      state.crossDateSearch = !state.crossDateSearch;
      $('searchScopeLabel').textContent = state.crossDateSearch ? '跨期搜尋' : '單期搜尋';
      render();
    });

    $('btnWatchlistOnly').addEventListener('click', () => { state.watchlistOnly = !state.watchlistOnly; render(); });

    $('moduleTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.mod-tab');
      if (!btn) return;
      state.activeModule = btn.dataset.mod;
      render();
    });

    $('agencyChips').addEventListener('click', (e) => {
      const btn = e.target.closest('.agency-chip');
      if (!btn) return;
      state.activeAgency = btn.dataset.agency;
      render();
    });

    $('btnResetFilters').addEventListener('click', () => {
      $('searchInput').value = ''; state.searchQuery = ''; state.watchlistOnly = false; state.activeAgency = 'all';
      $('btnClearSearch').classList.add('hidden');
      render();
    });

    $('sec2Sort').addEventListener('change', (e) => { state.sec2Sort = e.target.value; savePrefs(); renderSection2(); if (window.lucide) lucide.createIcons(); });
    $('sec3Sort').addEventListener('change', (e) => { state.sec3Sort = e.target.value; savePrefs(); renderSection3(); if (window.lucide) lucide.createIcons(); });
    $('sec4Sort').addEventListener('change', (e) => { state.sec4Sort = e.target.value; savePrefs(); renderSection4(); if (window.lucide) lucide.createIcons(); });

    let sx = 0, sy = 0, ignoreSwipe = false;
    $('swipeContainer').addEventListener('touchstart', (e) => {
      ignoreSwipe = Boolean(e.target.closest('.overflow-x-auto, table, input, select, button, a'));
      sx = e.changedTouches[0].screenX;
      sy = e.changedTouches[0].screenY;
    }, { passive: true });
    $('swipeContainer').addEventListener('touchend', (e) => {
      if (ignoreSwipe) return;
      const dx = e.changedTouches[0].screenX - sx, dy = e.changedTouches[0].screenY - sy;
      if (Math.abs(dx) > 85 && Math.abs(dx) > Math.abs(dy) * 2.0) {
        switchEdition(state.currentIndex + (dx < 0 ? 1 : -1), dx < 0 ? 'left' : 'right');
      }
    }, { passive: true });

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === $('searchInput')) return;
      if (e.key === 'ArrowLeft') switchEdition(state.currentIndex - 1, 'right');
      if (e.key === 'ArrowRight') switchEdition(state.currentIndex + 1, 'left');
    });

    async function tryLoadRemoteJson() {
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        try {
          const res = await fetch('./data/reports_index.json', { cache: 'no-store' });
          if (res.ok) {
            const remote = await res.json();
            if (Array.isArray(remote) && remote.length > 0) {
              const mergedMap = new Map();
              REPORTS_DATA.forEach(r => mergedMap.set(r.id, r));
              remote.forEach(r => { if (r && r.id && Array.isArray(r.co)) mergedMap.set(r.id, r); });
              state.reports = Array.from(mergedMap.values()).sort((a, b) => String(b.id).localeCompare(String(a.id)));
              render();
            }
          }
        } catch (_) {}
      }
    }

    render();
    tryLoadRemoteJson();
  </script>
</body>
</html>
