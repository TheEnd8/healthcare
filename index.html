<!doctype html>
<html lang="zh-TW" data-theme="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全球生技醫療產業即時情報</title>
<style>
:root{--bg:#fff;--bg2:#f4f6f9;--line:#dde2e8;--tx:#18222e;--mu:#637083;--ac:#0b5cad;--up:#c8281c;--dn:#0f7a55}
[data-theme=sage]{--bg:#f1f6f1;--bg2:#e3ede3;--line:#c9d9c9;--tx:#192b1b;--mu:#566e59;--ac:#2a7330}
[data-theme=ivory]{--bg:#fbf7ee;--bg2:#f0e9d9;--line:#e0d4bb;--tx:#2c2316;--mu:#74654d;--ac:#9a4f0a}
[data-theme=dark]{--bg:#11171e;--bg2:#1b232c;--line:#2c3743;--tx:#e8edf2;--mu:#97a3b2;--ac:#5aa9f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:1280px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;margin:0 0 2px}h2{font-size:1.1rem;margin:26px 0 8px;padding-left:10px;border-left:4px solid var(--ac)}
.mu{color:var(--mu);font-size:.85rem}
button,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:.84rem;margin:0 4px 4px 0}
.chip button{border:0;padding:0 6px;background:none;color:var(--mu)}
.res button{display:block;width:100%;text-align:left;margin-top:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.88rem}
th{background:var(--bg2);text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:1px 8px;border-radius:5px;font-size:.76rem;font-weight:600;background:var(--ac);color:#fff;white-space:nowrap}
.tag.s{background:var(--bg2);color:var(--tx);border:1px solid var(--line)}
.up{color:var(--up);font-weight:700}.dn{color:var(--dn);font-weight:700}.fl{color:var(--mu);font-weight:700}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.deep{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px}.deep h3{margin:0 0 6px;font-size:1rem}.deep li{margin:3px 0}
.warn{background:#fff4e5;color:#7a4300;border-radius:8px;padding:8px 12px;margin:8px 0}
a{color:var(--ac)}
.chipb{border-radius:99px;padding:2px 10px;font-size:.82rem;margin:2px}.chipb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.g td{background:var(--bg2);font-weight:700}
@media print{.bar,.noprint{display:none!important}:root,[data-theme]{--bg:#fff;--bg2:#f4f6f9;--tx:#000;--line:#bbb}main{max-width:none;padding:0}table{min-width:0;font-size:9pt}.tw{overflow:visible}h2{break-after:avoid}tr{break-inside:avoid}@page{size:A4 landscape;margin:10mm}}
</style>
</head>
<body>
<main>
<h1>全球生技醫療產業即時情報</h1>
<div class="mu" id="stamp">載入中…</div>

<div class="bar noprint">
  <select id="range" aria-label="報導區間">
    <option value="1">1 天</option><option value="3">3 天</option><option value="7">7 天</option><option value="14">雙週</option>
    <option value="30">1 個月</option><option value="60">2 個月</option><option value="90">3 個月</option><option value="180">6 個月</option><option value="365">1 年</option><option value="c">自選區間</option>
  </select>
  <span id="custom" hidden><input type="date" id="d1"> ～ <input type="date" id="d2"></span>
  <button id="dlMd">下載 Markdown</button>
  <button id="dlPdf">下載 PDF</button>
  <select id="theme" aria-label="色調"><option value="white">純白</option><option value="sage">柔綠</option><option value="ivory">暖米</option><option value="dark">深色</option></select>
  <button id="share">複製我的設定連結</button>
</div>

<div class="bar noprint" id="filters" style="display:block"></div>

<details class="noprint" open>
  <summary><b>重點關注標的</b> <span class="mu">（輸入名稱或代號，從清單中選擇；僅存在你的裝置）</span></summary>
  <div style="margin:8px 0" id="chips"></div>
  <input id="wq" placeholder="例如：藥華藥 / Moderna / 6446" style="width:240px">
  <div class="res" id="wres" style="max-width:440px"></div>
</details>

<div id="warn"></div>
<div id="report"></div>
<p class="mu">資料每日自動更新 3 次（台北約 06:30、14:30、21:30），由 AI 搜尋整理；全球指標業者在所選區間內若無實質新進展則不顯示。價格來自 Yahoo Finance，可能延遲，請與交易所或官方來源核對；不構成投資建議。</p>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link=u=>/^https?:\/\//.test(u||'')?` <a href="${esc(u)}" target="_blank" rel="noopener">來源↗</a>`:'';
const fmtD=d=>d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
let S=Object.assign({theme:'white',days:'1',watch:['6446.TWO','6919.TW','6472.TW']},JSON.parse(localStorage.getItem('S')||'{}'));
try{const h=new URLSearchParams(location.hash.slice(1)).get('s');if(h){Object.assign(S,JSON.parse(decodeURIComponent(escape(atob(h)))));history.replaceState(null,'',location.pathname)}}catch(e){}
const save=()=>localStorage.setItem('S',JSON.stringify(S));
let R=null;

function win(){
  const now=new Date();
  if(S.days==='c'){const a=$('#d1').value,b=$('#d2').value;return a&&b?[a.replace(/-/g,'/'),b.replace(/-/g,'/')]:[fmtD(new Date(Date.now()-864e5)),fmtD(now)]}
  return[fmtD(new Date(Date.now()-(+S.days)*864e5)),fmtD(now)];
}
const q=s=>R.quotes?.[s];
function px(s){
  const x=q(s);if(!x)return'<span class="mu">無報價</span>';
  const a=x.pct>0?'▲':x.pct<0?'▼':'●',c=x.pct>0?'up':x.pct<0?'dn':'fl';
  return`<span class="num"><b>${x.p}</b> ${esc(x.cur||'')}<br><span class="${c}">${a} ${x.pct>0?'+':''}${x.pct}%</span><br><span class="mu">${x.date}・${x.live?'即時':'收盤'}</span></span>`;
}
const evs=(l,f)=>l.length?l.map(e=>`<div><span class="mu">${esc(e.date)}</span> ${esc(e[f])}${f==='event'?link(e.url):''}</div>`).join(''):'<span class="mu">區間內無實質新進展</span>';
const tbl=(h,rows,n)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows||`<tr><td colspan=${n} class="mu">此區間無符合事件</td></tr>`}</table></div>`;

const CATS=['大型藥廠','生技新藥','CDMO/CRO/供應鏈','醫療器材/MedTech','智慧醫療/數位健康','醫療服務','醫藥通路','健康管理/長壽科技'];
const MKS=['美','歐','日','中','臺','澳','其他'],ORGS=['FDA','EMA','NMPA','TFDA','PMDA','其他'];
const off=(k,v)=>(S.x?.[k]||[]).includes(v);
const normOrg=o=>ORGS.includes(o)?o:'其他';
function view(){
  const [f,t]=win(),inR=e=>e.date>=f&&e.date<=t;
  const pool=Object.fromEntries(R.T.map(x=>[x.s,x]));
  const byS={};R.co.filter(inR).forEach(e=>(byS[e.sym]=byS[e.sym]||[]).push(e));
  const info=s=>({s,n:pool[s]?.n||byS[s]?.[0]?.name||s,m:pool[s]?.m||byS[s]?.[0]?.market||'其他',c:pool[s]?.c||'其他分類',ai:!pool[s]||!!pool[s].ai,ev:(byS[s]||[]).sort((a,b)=>b.date.localeCompare(a.date))});
  const okF=w=>!off('mk',w.m)&&!off('cat',w.c);
  const reg=R.reg.filter(x=>x.date>=f&&(x.date<=t||/PDUFA|CHMP|審議/.test(x.type||''))&&!off('org',normOrg(x.org))).sort((a,b)=>b.date.localeCompare(a.date));
  const watch=S.watch.map(info).filter(okF);
  const glob=Object.keys(byS).map(info).filter(okF).sort((a,b)=>b.ev[0].date.localeCompare(a.ev[0].date));
  return{f,t,reg,watch,glob};
}
const grp=(rows,keyf,base,fn,n)=>[...new Set([...base,...rows.map(keyf)])].map(k=>{const l=rows.filter(r=>keyf(r)===k);return l.length?`<tr class="g"><td colspan=${n}>${esc(k)}（${l.length}）</td></tr>`+l.map(fn).join(''):''}).join('');

function render(){
  document.documentElement.dataset.theme=S.theme;$('#theme').value=S.theme;$('#range').value=S.days;$('#custom').hidden=S.days!=='c';
  const cats=[...new Set([...CATS,...(R?.T||[]).map(x=>x.c).filter(Boolean)])];
  const ch=(k,label,l)=>`<span class="mu">${label}</span> `+l.map(v=>`<button class="chipb ${off(k,v)?'':'on'}" data-k="${k}" data-v="${esc(v)}">${esc(v)}</button>`).join('');
  $('#filters').innerHTML=[ch('org','藥監機關',ORGS),ch('mk','市場',MKS),ch('cat','產業分類',cats)].join('<br>')+' <button id="fall">全部顯示</button>';
  $('#chips').innerHTML=S.watch.map((s,i)=>`<span class="chip">${esc(R?.T.find(x=>x.s===s)?.n||s)} <span class="mu">${esc(s)}</span><button data-i="${i}" aria-label="移除">✕</button></span>`).join('')||'<span class="mu">尚未加入</span>';
  if(!R){return}
  const v=view();
  $('#stamp').textContent=`報導區間 ${v.f} ～ ${v.t}｜資料更新 ${new Date(R.ts).toLocaleString('zh-TW')}`;
  const cat=w=>`<td><b>${esc(w.n)}</b><br>${w.m?`<span class="tag s">${esc(w.m)}</span> `:''}<span class="mu">${esc(w.s)}</span>${w.ai?'':'<br><span class="mu">僅報價，未納入 AI 事件搜尋</span>'}</td><td>${px(w.s)}</td><td class="num">${w.ev.map(e=>esc(e.date)).join('<br>')||'—'}</td>`;
  $('#report').innerHTML=
   '<h2>一、各國藥監機關政策及審查動態</h2>'+tbl(['監管機關','藥品/醫材','所屬藥廠/單位','日期','適應症與核准類別','商業與臨床價值'],grp(v.reg,x=>normOrg(x.org),ORGS,x=>`<tr><td><span class="tag">${esc(x.org)}</span></td><td><b>${esc(x.name)}</b></td><td>${esc(x.company)}</td><td class="num">${esc(x.date)}</td><td>${esc(x.indication)}<br><span class="tag s">${esc(x.type)}</span></td><td>${esc(x.value)}${link(x.url)}</td></tr>`,6),6)+
   '<h2>二、指定重點關注標的近期動態</h2>'+tbl(['個股與代號','基準價（日期・漲跌）','事件日期','區間內實質重大進展','後續催化劑'],grp(v.watch,w=>w.c,cats,w=>`<tr>${cat(w)}<td>${evs(w.ev,'event')}</td><td>${w.ev.map(e=>esc(e.catalyst)).join('<br>')||'—'}</td></tr>`,5),5)+
   '<h2>三、全球指標生醫業者動態</h2>'+tbl(['個股與市場','基準價（日期・漲跌）','事件日期','最新重大催化劑','市場影響評估'],grp(v.glob,w=>w.c,cats,w=>`<tr>${cat(w)}<td>${evs(w.ev,'event')}</td><td>${evs(w.ev,'impact')}</td></tr>`,5),5)+
   '<h2>四、核心突破深度解析與產業趨勢預測</h2>'+((R.deep||[]).map(d=>`<div class="deep"><h3>${esc(d.title)}</h3><ul>${(d.points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul><b>趨勢預測：</b>${esc(d.trend)}</div>`).join('')||'<p class="mu">資料累積中，尚無深度解析</p>')+'<p class="mu">深度解析以近一週資料為準，不隨區間變動。</p>';
}

function md(){
  const v=view(),c=s=>String(s??'').replace(/\|/g,'/').replace(/\n/g,' ');
  const pm=s=>{const x=q(s);return x?`${x.p} ${x.cur||''} ${x.pct>0?'▲+':x.pct<0?'▼':'●'}${x.pct}% (${x.date} ${x.live?'即時':'收盤'})`:'無報價'};
  const ev=(l,k)=>l.length?l.map(e=>`${e.date} ${c(e[k])}`).join('；'):'無實質新進展';
  const tb=(h,r)=>`| ${h.join(' | ')} |\n|${h.map(()=>'---').join('|')}|\n${r.join('\n')}`;
  return `# 全球生技醫療產業即時情報\n\n報導區間：${v.f} ～ ${v.t}｜資料更新：${new Date(R.ts).toLocaleString('zh-TW')}\n\n## 一、各國藥監機關政策及審查動態\n\n`+
  tb(['機關','藥品/醫材','藥廠/單位','日期','適應症與類別','商業與臨床價值'],v.reg.map(x=>`| ${c(x.org)} | ${c(x.name)} | ${c(x.company)} | ${x.date} | ${c(x.indication)}（${c(x.type)}） | ${c(x.value)} ${x.url||''} |`))+
  '\n\n## 二、指定重點關注標的近期動態\n\n'+tb(['個股','基準價','事件日期','重大進展','後續催化劑'],v.watch.map(w=>`| ${c(w.n)} ${w.s} | ${pm(w.s)} | ${w.ev.map(e=>e.date).join('、')||'—'} | ${ev(w.ev,'event')} | ${w.ev.map(e=>c(e.catalyst)).join('；')||'—'} |`))+
  '\n\n## 三、全球指標生醫業者動態\n\n'+tb(['個股與市場','基準價','事件日期','最新重大催化劑','市場影響評估'],v.glob.map(w=>`| ${c(w.n)} (${w.m}) ${w.s} | ${pm(w.s)} | ${w.ev.map(e=>e.date).join('、')} | ${ev(w.ev,'event')} | ${ev(w.ev,'impact')} |`))+
  '\n\n## 四、核心突破深度解析與產業趨勢預測\n\n'+(R.deep||[]).map(x=>`### ${x.title}\n${(x.points||[]).map(p=>'- '+p).join('\n')}\n\n**趨勢預測：** ${x.trend}\n`).join('\n')+
  '\n> AI 搜尋整理，價格與連結請與官方來源核對；不構成投資建議。\n';
}

$('#range').onchange=e=>{S.days=e.target.value;save();render()};
$('#d1').onchange=$('#d2').onchange=render;
$('#filters').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.x=S.x||{org:[],mk:[],cat:[]};if(b.id==='fall')S.x={org:[],mk:[],cat:[]};else{const l=S.x[b.dataset.k],v=b.dataset.v,i=l.indexOf(v);i<0?l.push(v):l.splice(i,1)}save();render()};
$('#theme').onchange=e=>{S.theme=e.target.value;save();render()};
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.watch.splice(+b.dataset.i,1);save();render()};
$('#wq').oninput=e=>{
  const k=e.target.value.trim().toLowerCase();if(!k||!R){$('#wres').innerHTML='';return}
  const l=R.T.filter(x=>(x.n+x.s).toLowerCase().includes(k)&&!S.watch.includes(x.s)).slice(0,6);
  $('#wres').innerHTML=l.length?l.map(x=>`<button data-s="${esc(x.s)}">${esc(x.s)}　${esc(x.n)} <span class="mu">${esc(x.m)}</span></button>`).join(''):'<span class="mu">清單內找不到。可請網站管理者在 tickers.json 新增該公司。</span>';
};
$('#wres').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.watch.push(b.dataset.s);$('#wq').value='';$('#wres').innerHTML='';save();render()};
const dl=(n,t,d)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()};
$('#dlMd').onclick=()=>R&&dl('生技醫療情報_'+fmtD(new Date()).replace(/\//g,'')+'.md','text/markdown;charset=utf-8','\ufeff'+md());
$('#dlPdf').onclick=()=>{if(!R)return;alert('將開啟列印視窗，請選「另存為 PDF」。');print()};
$('#share').onclick=async()=>{const u=location.origin+location.pathname+'#s='+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  try{await navigator.clipboard.writeText(u);alert('已複製。在其他裝置開啟此連結即可帶入你的關注標的與偏好。')}catch(e){prompt('請複製：',u)}};

render();
fetch('data/report.json?'+Date.now()).then(r=>r.json()).then(j=>{R=j;render()})
  .catch(()=>{$('#stamp').textContent='';$('#warn').innerHTML='<div class="warn">尚無資料。請網站管理者到 GitHub 的 Actions 手動執行一次「update-report」。</div>'});
</script>
</body>
</html>
