<!doctype html>
<html lang="zh-TW" data-theme="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>情報儀表板</title>
<style>
:root{--bg:#fff;--bg2:#f5f6f8;--line:#dfe3e8;--tx:#1b2430;--mu:#667085;--ac:#0b6bcb;--up:#d92d20;--dn:#12805c}
[data-theme=sage]{--bg:#f1f6f1;--bg2:#e4ede4;--line:#cbdacb;--tx:#1a2c1c;--mu:#58705b;--ac:#2e7d32}
[data-theme=ivory]{--bg:#fbf7ee;--bg2:#f1eadb;--line:#e1d5bd;--tx:#2d2417;--mu:#76674f;--ac:#a4540b}
[data-theme=dark]{--bg:#12181f;--bg2:#1c242d;--line:#2d3844;--tx:#e8edf2;--mu:#98a4b3;--ac:#5aa9f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:1200px;margin:0 auto;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.15rem;margin:0}.mu{color:var(--mu);font-size:.85rem}
section{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;background:var(--bg)}
.hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px}
#track>.hd{cursor:pointer}.body{padding:0 14px 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cat{background:var(--bg2);border-radius:10px;padding:10px}.cat h3{margin:0 0 8px;font-size:.92rem}
.pill{display:inline-block;margin:0 5px 6px 0;padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:.84rem;user-select:none}
.pill.on{background:var(--ac);border-color:var(--ac);color:#fff}
.cat input{width:100%;margin-top:4px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));padding:0 14px 14px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;text-decoration:none;color:inherit;display:block}
.card b{display:block}.row{display:flex;justify-content:space-between;align-items:baseline}
.px{font-size:1.2rem;font-weight:700}.up{color:var(--up)}.dn{color:var(--dn)}
svg{width:100%;height:56px;display:block}
.item{border-top:1px solid var(--line)}
.it{padding:10px 14px;cursor:pointer}.it:hover{background:var(--bg2)}
.det{display:none;padding:0 14px 12px}.item.open .det{display:block}
.tag{font-size:.75rem;background:var(--bg2);border-radius:5px;padding:1px 7px;margin-right:4px}
a.go{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:8px;background:var(--ac);color:#fff;text-decoration:none}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);max-width:480px;width:92%}
dialog label{display:block;margin:10px 0 4px;font-weight:600}dialog input,dialog select{width:100%}
.stepper input{width:64px;text-align:center}
</style>
</head>
<body>
<main>
<header>
  <div><h1>情報儀表板</h1><div class="mu" id="stamp">尚未連線</div></div>
  <div>
    <button class="p" id="refresh">立即更新</button>
    <button id="openCfg">設定</button>
  </div>
</header>

<section id="track">
  <div class="hd" id="trackBar"><div id="sum"></div><span class="mu" id="arrow">展開 ▾</span></div>
  <div class="body" id="trackBody" hidden>
    <div class="grid" id="cats"></div>
    <p><button id="all">全選</button> <button id="none">全不選</button> <button class="p" id="apply">套用並更新</button></p>
  </div>
</section>

<section>
  <div class="hd">
    <b>股價與指數</b>
    <div>
      <select id="mode"><option value="mine">我的追蹤</option><option value="topcap">市值前十大</option><option value="movers">昨日漲跌幅最大</option></select>
      <select id="range"><option value="5">5 日</option><option value="30">1 個月</option></select>
      <span class="stepper"><button id="cm">−</button><input id="cn" type="number" min="1"><button id="cp">＋</button><button id="call">全部</button></span>
    </div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="mu" style="padding:0 14px 12px">報價來自 Yahoo Finance，可能延遲 15–20 分鐘；點卡片前往 Bloomberg 查看原始行情。</div>
</section>

<section>
  <div class="hd">
    <b>追蹤情報</b>
    <div>
      <select id="sort"><option value="new">最新優先</option><option value="old">最舊優先</option><option value="imp">重要性</option><option value="src">依來源</option></select>
      <label class="mu">筆數 <input id="limit" type="number" min="1" style="width:64px"></label>
      <input id="find" placeholder="搜尋標題" style="width:120px">
    </div>
  </div>
  <div id="feed"></div>
</section>
</main>

<dialog id="cfg">
  <h3>設定</h3>
  <label>後端網址 (Apps Script /exec)</label><input id="cApi">
  <label>存取密碼 (SECRET)</label><input id="cTok" type="password">
  <label>每日自動收集時間</label><input id="cTime" type="time">
  <label>色調</label>
  <select id="cTheme"><option value="white">純白 (預設)</option><option value="sage">柔綠</option><option value="ivory">暖米</option><option value="dark">深色</option></select>
  <label>漲跌顏色</label>
  <select id="cUp"><option value="red">紅漲綠跌 (台股)</option><option value="green">綠漲紅跌 (美股)</option></select>
  <p class="mu" id="phone"></p>
  <p><button class="p" id="cSave">儲存</button> <button id="cClose">關閉</button></p>
</dialog>

<script>
const CAT={
ind:[['生技醫藥與新藥研發','',1],['CDMO 委託開發製造','',1],['GLP-1 減重與代謝藥物','',1],['免疫腫瘤與細胞基因療法','',1],['特殊劑型與學名藥','',1],['醫療器材與智慧醫療','',1],['半導體晶圓代工'],['IC設計'],['先進封裝'],['AI伺服器與散熱'],['矽光子與CPO'],['電動車與車用電子']],
co:[['保瑞藥業','6472.TW',1],['藥華藥','6446.TWO',1],['美時製藥','1795.TW',1],['康霈','6919.TW',1],['禮來 Eli Lilly','LLY',1],['諾和諾德','NVO',1],['台積電','2330.TW'],['輝達','NVDA'],['聯發科','2454.TW'],['鴻海','2317.TW'],['廣達','2382.TW'],['蘋果','AAPL'],['微軟','MSFT']],
kw:[['FDA 藥證核准','',1],['GLP-1 減重適應症','',1],['CDMO 併購','',1],['授權金 里程碑','',1],['孤兒藥資格','',1],['2nm 良率'],['CoWoS 產能'],['出口管制']],
src:[['環球生技月刊','gbimonthly.com',1],['Genet 生技資訊','genetinfo.com',1],['Fierce Biotech','fiercebiotech.com',1],['鉅亨網','cnyes.com',1],['工商時報','ctee.com.tw'],['經濟日報','money.udn.com'],['科技新報','technews.tw'],['Bloomberg','bloomberg.com']]};
const TITLE={ind:'產業與次產業',co:'熱門與大市值公司 (名稱|代號)',kw:'熱門關鍵字',src:'專業網站 (名稱|網域或 RSS 網址)'};
const TOP=['NVDA','MSFT','AAPL','GOOGL','AMZN','META','AVGO','TSM','TSLA','LLY'];
const UNI=TOP.concat(['2330.TW','2317.TW','2454.TW','2382.TW','3017.TW','3324.TW','6472.TW','6446.TWO','1795.TW','NVO','AMD','SMCI','ARM','INTC','MRNA','PFE','JNJ','ABBV','MRK']);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEYS=Object.keys(CAT);

const def=()=>({theme:'white',up:'red',mode:'mine',range:30,count:6,sort:'new',limit:10,time:'08:30',rev:0,
  cus:{ind:[],co:[],kw:[],src:[]},sel:Object.fromEntries(KEYS.map(k=>[k,CAT[k].filter(x=>x[2]).map(x=>x[0])]))});
let S=Object.assign(def(),JSON.parse(localStorage.getItem('S')||'{}'));
let D=JSON.parse(localStorage.getItem('D')||'{}');
let conn=JSON.parse(localStorage.getItem('conn')||'{}');
let openId=null,timer;

// 以網址 #u=...&t=... 讓手機一次帶入連線資訊
if(location.hash.length>2){const h=new URLSearchParams(location.hash.slice(1));if(h.get('u')){conn={u:h.get('u'),t:h.get('t')||''};localStorage.setItem('conn',JSON.stringify(conn));history.replaceState(null,'',location.pathname)}}

const all=k=>CAT[k].concat(S.cus[k]);
const on=(k,n)=>S.sel[k].includes(n);
const picked=k=>all(k).filter(x=>on(k,x[0]));

function job(){
  const co=picked('co');
  const src=picked('src');
  return{
    q:[...co.map(x=>x[0]),...picked('kw').map(x=>x[0]),...picked('ind').map(x=>x[0])],
    rss:src.filter(x=>/^https?:/.test(x[1])).map(x=>x[1]),
    dom:src.filter(x=>x[1]&&!/^https?:/.test(x[1])).map(x=>x[1]),
    sym:[...new Set([...co.map(x=>x[1]).filter(Boolean),...UNI])]};
}

function persist(){
  localStorage.setItem('S',JSON.stringify(S));
  clearTimeout(timer);timer=setTimeout(push,1200);
}
async function push(){
  if(!conn.u)return;
  S.job=job();S.rev=Date.now();localStorage.setItem('S',JSON.stringify(S));
  try{await fetch(conn.u+'?t='+encodeURIComponent(conn.t),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(S)})}
  catch(e){$('#stamp').textContent='設定同步失敗，已存在本機'}
}
async function pull(refresh){
  if(!conn.u){$('#stamp').textContent='請先在「設定」填入後端網址與密碼';return}
  $('#stamp').textContent=refresh?'更新中，約需 10–30 秒…':'讀取中…';
  try{
    if(refresh)await push();
    const r=await(await fetch(conn.u+'?t='+encodeURIComponent(conn.t)+(refresh?'&a=refresh':''))).json();
    if(r.error){$('#stamp').textContent='密碼錯誤';return}
    if(r.settings&&r.settings.rev>S.rev&&!refresh){S=Object.assign(def(),r.settings);localStorage.setItem('S',JSON.stringify(S))}
    D=r.data||{};localStorage.setItem('D',JSON.stringify(D));
    $('#stamp').textContent=D.ts?'資料時間 '+new Date(D.ts).toLocaleString('zh-TW'):'尚無資料，請按「立即更新」';
  }catch(e){$('#stamp').textContent='連線失敗，顯示本機快取'}
  render();
}

function renderCats(){
  $('#cats').innerHTML=KEYS.map(k=>`<div class="cat"><h3>${TITLE[k]}</h3>${all(k).map(x=>`<span class="pill ${on(k,x[0])?'on':''}" data-k="${k}" data-n="${esc(x[0])}">${esc(x[0])}</span>`).join('')}<input data-add="${k}" placeholder="自訂項目，按 Enter 新增"></div>`).join('');
  const s=k=>picked(k).length;
  $('#sum').innerHTML=`<b>追蹤條件</b> <span class="mu">產業 ${s('ind')}・公司 ${s('co')}・關鍵字 ${s('kw')}・網站 ${s('src')}（點此展開）</span>`;
}
function spark(c,up){
  if(c.length<2)return'';const mn=Math.min(...c),mx=Math.max(...c),w=300,h=56;
  const pts=c.map((v,i)=>[i/(c.length-1)*w,h-4-(v-mn)/((mx-mn)||1)*(h-8)]);
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--${up?'up':'dn'})" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/></svg>`;
}
function symList(){
  const q=D.quotes||{};
  if(S.mode==='topcap')return TOP;
  if(S.mode==='movers')return Object.keys(q).sort((a,b)=>Math.abs(q[b].pct)-Math.abs(q[a].pct));
  const mine=picked('co').map(x=>x[1]).filter(Boolean);
  return mine.length?mine:TOP;
}
function renderCharts(){
  const q=D.quotes||{};let list=symList().filter(s=>q[s]);
  if(S.count!=='all')list=list.slice(0,S.count);
  $('#cn').value=S.count==='all'?list.length:S.count;
  const name=s=>{const c=all('co').find(x=>x[1]===s);return c?c[0]:q[s].n};
  $('#cards').innerHTML=list.length?list.map(s=>{
    const x=q[s],up=x.pct>=0,c=x.c.slice(-S.range);
    return`<a class="card" target="_blank" rel="noopener" href="https://www.bloomberg.com/quote/${esc(s.replace(/\.TWO?$/,':TT').replace(/^([A-Z]+)$/,'$1:US'))}"><div class="row"><b>${esc(name(s))}</b><span class="mu">${esc(s)}</span></div><div class="row"><span class="px">${x.p?.toFixed(2)}</span><span class="${up?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(x.pct).toFixed(2)}%</span></div>${spark(c,up)}</a>`}).join(''):'<div class="mu">尚無報價，請按「立即更新」。</div>';
}
function renderFeed(){
  let l=(D.news||[]).slice();const f=$('#find').value.trim().toLowerCase();
  if(f)l=l.filter(x=>x.t.toLowerCase().includes(f));
  const cmp={new:(a,b)=>b.d-a.d,old:(a,b)=>a.d-b.d,imp:(a,b)=>b.sc-a.sc,src:(a,b)=>a.s.localeCompare(b.s)}[S.sort];
  l.sort(cmp);const total=l.length;l=l.slice(0,S.limit);
  $('#feed').innerHTML=l.length?l.map((x,i)=>`<div class="item ${openId===i?'open':''}"><div class="it" data-i="${i}"><div class="mu">${esc(x.s)}・${new Date(x.d).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}・重要性 ${x.sc}</div><div>${esc(x.t)}</div></div><div class="det"><p>${x.sm?esc(x.sm):'<span class="mu">此來源只提供標題。於後端設定 GEMINI_KEY 可自動產生摘要。</span>'}</p>${x.h.map(h=>`<span class="tag">${esc(h)}</span>`).join('')}<br>${/^https?:/.test(x.l)?`<a class="go" target="_blank" rel="noopener" href="${esc(x.l)}">前往原始網頁</a>`:''}</div></div>`).join(''):'<div class="mu" style="padding:14px">沒有符合的情報。</div>';
  $('#feed').dataset.total=total;
}
function render(){
  document.documentElement.dataset.theme=S.theme;
  const r=document.documentElement.style;r.setProperty('--up',S.up==='red'?'#d92d20':'#12805c');r.setProperty('--dn',S.up==='red'?'#12805c':'#d92d20');
  $('#mode').value=S.mode;$('#range').value=S.range;$('#sort').value=S.sort;$('#limit').value=S.limit;
  renderCats();renderCharts();renderFeed();
}

// 事件
$('#trackBar').onclick=()=>{const h=$('#trackBody').hidden=!$('#trackBody').hidden;$('#arrow').textContent=h?'展開 ▾':'收合 ▴'};
$('#cats').onclick=e=>{const p=e.target.closest('.pill');if(!p)return;const{k,n}=p.dataset;S.sel[k]=on(k,n)?S.sel[k].filter(v=>v!==n):[...S.sel[k],n];persist();renderCats()};
$('#cats').onkeydown=e=>{
  if(e.key!=='Enter'||!e.target.dataset.add)return;const k=e.target.dataset.add,v=e.target.value.trim();if(!v)return;
  const[n,x='']=v.split('|').map(s=>s.trim());S.cus[k].push([n,x,1]);S.sel[k].push(n);persist();renderCats()};
$('#all').onclick=()=>{KEYS.forEach(k=>S.sel[k]=all(k).map(x=>x[0]));persist();renderCats()};
$('#none').onclick=()=>{KEYS.forEach(k=>S.sel[k]=[]);persist();renderCats()};
$('#apply').onclick=()=>{$('#trackBar').click();pull(true)};
$('#refresh').onclick=()=>pull(true);
$('#mode').onchange=e=>{S.mode=e.target.value;persist();renderCharts()};
$('#range').onchange=e=>{S.range=+e.target.value;persist();renderCharts()};
const setCount=v=>{S.count=v==='all'?'all':Math.max(1,+v||1);persist();renderCharts()};
$('#cn').onchange=e=>setCount(e.target.value);
$('#cm').onclick=()=>setCount((S.count==='all'?symList().length:S.count)-1);
$('#cp').onclick=()=>setCount((S.count==='all'?symList().length:S.count)+1);
$('#call').onclick=()=>setCount('all');
$('#sort').onchange=e=>{S.sort=e.target.value;persist();renderFeed()};
$('#limit').onchange=e=>{S.limit=Math.max(1,+e.target.value||10);persist();renderFeed()};
$('#find').oninput=renderFeed;
$('#feed').onclick=e=>{const it=e.target.closest('.it');if(!it)return;const i=+it.dataset.i;openId=openId===i?null:i;renderFeed()};
$('#openCfg').onclick=()=>{
  $('#cApi').value=conn.u||'';$('#cTok').value=conn.t||'';$('#cTime').value=S.time;$('#cTheme').value=S.theme;$('#cUp').value=S.up;
  $('#phone').textContent=conn.u?'換裝置時開啟：'+location.origin+location.pathname+'#u='+encodeURIComponent(conn.u)+'&t='+encodeURIComponent(conn.t)+'（含密碼，請勿公開）':'';
  $('#cfg').showModal()};
$('#cClose').onclick=()=>$('#cfg').close();
$('#cSave').onclick=()=>{
  conn={u:$('#cApi').value.trim(),t:$('#cTok').value};localStorage.setItem('conn',JSON.stringify(conn));
  S.time=$('#cTime').value||'08:30';S.theme=$('#cTheme').value;S.up=$('#cUp').value;
  $('#cfg').close();render();persist();setTimeout(()=>pull(false),1500)};

render();pull(false);
</script>
</body>
</html>
