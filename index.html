<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global &amp; Healthcare Info Hub × 整合情報工作台</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .swipe-transition { transition: transform 0.22s ease-out, opacity 0.22s ease-out; }
    .swipe-left { transform: translateX(-16px); opacity: 0.55; }
    .swipe-right { transform: translateX(16px); opacity: 0.55; }
    mark { background-color: #fef08a; color: #0f172a; padding: 0 2px; border-radius: 3px; }

<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">
  <!-- 單一整合頂部導覽列 Header -->
  <header id="appHeader" class="bg-gradient-to-r from-slate-900 via-indigo-950 to-sky-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center shrink-0">
          <i data-lucide="globe" class="w-5 h-5 text-sky-300"></i>
        </div>
        <div class="min-w-0">
          <h1 class="text-base sm:text-lg font-bold tracking-tight truncate">Global &amp; Healthcare Info Hub</h1>
          <p class="text-xs text-slate-300 truncate">生醫情報 × 全產業財經與券商研報｜每日 07:30・16:30 同步更新</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0 flex-wrap">
        <!-- 頻道切換（單一工作台整合） -->
        <div class="flex items-center bg-black/25 p-1 rounded-xl border border-white/15" role="group" aria-label="頻道篩選">
          <button data-channel="all" type="button" class="ch-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer">🌐 全部</button>
          <button data-channel="market" type="button" class="ch-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer">📊 全產業</button>
          <button data-channel="biotech" type="button" class="ch-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer">🧬 生醫</button>
        </div>

        <!-- 統一配色色調選擇器 -->
        <div class="flex items-center gap-1.5 bg-white/10 px-2.5 py-1 rounded-xl border border-white/15">
          <i data-lucide="palette" class="w-3.5 h-3.5 text-sky-200"></i>
          <select id="themeSelect" aria-label="配色色調" class="bg-transparent text-xs font-medium text-white focus:outline-none cursor-pointer">
            <option value="vibrant" class="text-slate-900">活力繽紛</option>
            <option value="ocean" class="text-slate-900">海洋專業</option>
            <option value="aurora" class="text-slate-900">極光深邃</option>
            <option value="warm" class="text-slate-900">暖陽大地</option>
          </select>
        </div>

        <!-- 統一檢視模式切換（同時套用於所有區塊） -->
        <div class="flex items-center bg-black/25 p-1 rounded-xl border border-white/15" role="group" aria-label="檢視模式切換">
          <button id="btnViewTable" type="button" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer bg-sky-500 text-white">
            <i data-lucide="table-2" class="w-3.5 h-3.5"></i>
            <span>表格</span>
          </button>
          <button id="btnViewCard" type="button" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer text-slate-200 hover:text-white">
            <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
            <span>卡片</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 統一參數列：期間、自訂日期與顯示區塊 -->
    <div id="paramBar" class="bg-black/25 border-t border-white/10">
      <div class="max-w-7xl mx-auto px-4 py-2 flex flex-col lg:flex-row lg:items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-2 flex-wrap">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
            <span class="text-slate-300 shrink-0">期間：</span>
            <button data-days="1" type="button" class="period-btn px-2 py-1 rounded-md font-medium cursor-pointer shrink-0">1天</button>
            <button data-days="3" type="button" class="period-btn px-2 py-1 rounded-md font-medium cursor-pointer shrink-0">3天</button>
            <button data-days="7" type="button" class="period-btn px-2 py-1 rounded-md font-medium cursor-pointer shrink-0">7天</button>
            <button data-days="14" type="button" class="period-btn px-2 py-1 rounded-md font-medium cursor-pointer shrink-0">14天</button>
            <button data-days="30" type="button" class="period-btn px-2 py-1 rounded-md font-medium cursor-pointer shrink-0">30天</button>
            <button data-days="90" type="button" class="period-btn px-2 py-1 rounded-md font-medium cursor-pointer shrink-0">90天</button>
          </div>
          <div class="flex items-center gap-1.5 bg-white/10 px-2 py-1 rounded-lg border border-white/15">
            <input id="startDateInput" type="date" aria-label="起始日期" class="bg-transparent text-xs text-white focus:outline-none cursor-pointer [color-scheme:dark]" />
            <span class="text-slate-300">～</span>
            <input id="endDateInput" type="date" aria-label="結束日期" class="bg-transparent text-xs text-white focus:outline-none cursor-pointer [color-scheme:dark]" />
          </div>
        </div>

        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
          <span class="text-slate-300 shrink-0">顯示區塊：</span>
          <button data-sec="all" type="button" class="sec-btn px-2.5 py-1 rounded-md font-medium cursor-pointer shrink-0">全部</button>
          <button data-sec="0" type="button" class="sec-btn px-2.5 py-1 rounded-md font-medium cursor-pointer shrink-0">一、全產業與研報</button>
          <button data-sec="1" type="button" class="sec-btn px-2.5 py-1 rounded-md font-medium cursor-pointer shrink-0">二、生醫早晚報</button>
          <button data-sec="2" type="button" class="sec-btn px-2.5 py-1 rounded-md font-medium cursor-pointer shrink-0">三、深度解析</button>
          <button data-sec="3" type="button" class="sec-btn px-2.5 py-1 rounded-md font-medium cursor-pointer shrink-0">四、各國藥監</button>
          <button data-sec="4" type="button" class="sec-btn px-2.5 py-1 rounded-md font-medium cursor-pointer shrink-0">五、關注標的</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 統一搜尋與快速篩選列 -->
  <section id="searchSection" class="bg-white border-b border-slate-200 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 py-3 space-y-2.5">
      <div class="flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input id="searchInput" type="text" autocomplete="off" placeholder="全站搜尋個股（如 7974、SpaceX、嘉澤、6446.TW、VRTX）、產業或藥監機關..." class="w-full pl-9 pr-9 py-2 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition" />
          <button id="btnClearSearch" type="button" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 p-1 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-200 cursor-pointer" title="清除">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
          <div id="autocompleteList" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-30 max-h-60 overflow-y-auto divide-y divide-slate-100"></div>
        </div>
        <div class="flex items-center gap-2 shrink-0 flex-wrap">
          <button id="btnWatchlistOnly" type="button" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl border text-xs sm:text-sm font-medium transition cursor-pointer bg-slate-50 border-slate-300 text-slate-700 hover:bg-slate-100">
            <i data-lucide="star" class="w-4 h-4 text-amber-500"></i>
            <span>僅看關注股</span>
          </button>
          <div id="agencyChips" class="flex items-center gap-1 overflow-x-auto no-scrollbar">
            <button data-agency="all" type="button" class="agency-chip px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer shrink-0">全藥監</button>
            <button data-agency="FDA" type="button" class="agency-chip px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer shrink-0">FDA</button>
            <button data-agency="EMA" type="button" class="agency-chip px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer shrink-0">EMA</button>
            <button data-agency="NMPA" type="button" class="agency-chip px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer shrink-0">NMPA</button>
            <button data-agency="TFDA" type="button" class="agency-chip px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer shrink-0">TFDA</button>
            <button data-agency="PMDA" type="button" class="agency-chip px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer shrink-0">PMDA</button>
          </div>
        </div>
      </div>

      <!-- 整合熱門主題 -->
      <div class="flex items-center gap-2 flex-wrap">
        <span class="inline-flex items-center gap-1 text-xs font-medium text-slate-500 shrink-0">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-sky-500"></i>
          熱門焦點：
        </span>
        <div id="relatedTopicsBar" class="flex items-center gap-1.5 flex-wrap"></div>
      </div>
    </div>
  </section>

  <!-- 單一整合工作區 Main Workspace -->
  <main id="unifiedMain" class="flex-1 max-w-7xl w-full mx-auto px-4 py-5 space-y-6">
    <div id="searchStatusBanner" class="hidden px-4 py-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs sm:text-sm flex items-center justify-between gap-2">
      <span id="searchStatusText"></span>
      <button id="btnResetFilters" type="button" class="text-xs font-semibold underline hover:text-amber-700 shrink-0 cursor-pointer">重設條件</button>
    </div>

    <!-- SECTION 0: 全產業財經與券商研究報告（與生醫區塊完全同款佈局） -->
    <section id="sec0Container" class="space-y-4 rounded-2xl p-4 sm:p-5 border-2 shadow-xs">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h2 id="sec0Title" class="text-lg sm:text-xl font-bold pl-3 border-l-4">一、全產業財經與券商研究報告</h2>
            <span id="mhEditionBadge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold"></span>
          </div>
          <p id="mhEditionMeta" class="text-xs sm:text-sm text-slate-600 mt-1"></p>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <select id="mhEditionSelect" aria-label="全產業期別" class="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white text-slate-700 font-medium cursor-pointer"></select>
        </div>
      </div>

      <!-- 產業次分類分頁 -->
      <div id="mhCategoryTabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>

      <!-- 內容呈現區（表格／卡片自動同步） -->
      <div id="sec0Content" class="space-y-4"></div>
    </section>

    <!-- SECTION 1: 全球生醫每日早報／晚報 -->
    <section id="sec1Container" class="space-y-4 rounded-2xl p-4 sm:p-5 border-2 shadow-xs">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h2 id="sec1Title" class="text-lg sm:text-xl font-bold pl-3 border-l-4">二、全球生醫每日早報／晚報</h2>
            <span id="editionBadge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold"></span>
          </div>
          <p id="editionHeadline" class="text-xs sm:text-sm text-slate-600 mt-1"></p>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btnPrevDate" type="button" title="較新期別" class="p-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 disabled:opacity-35 disabled:cursor-not-allowed text-slate-700 transition cursor-pointer">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <div id="datePills" class="flex items-center gap-1 overflow-x-auto no-scrollbar max-w-[240px] sm:max-w-md"></div>
          <button id="btnNextDate" type="button" title="較早期別" class="p-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 disabled:opacity-35 disabled:cursor-not-allowed text-slate-700 transition cursor-pointer">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div id="moduleTabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
        <button data-mod="all" type="button" class="mod-tab px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0">全部</button>
        <button data-mod="co" type="button" class="mod-tab px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0">公司重大事件</button>
        <button data-mod="reg" type="button" class="mod-tab px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0">五大藥監</button>
        <button data-mod="cat" type="button" class="mod-tab px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0">催化劑追蹤</button>
        <button data-mod="deep" type="button" class="mod-tab px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0">深度研報</button>
      </div>

      <div id="swipeContainer" class="swipe-transition space-y-4"></div>
    </section>

    <!-- SECTION 2: 深度解析：政策、重大事件與技術突破 -->
    <section id="sec2Container" class="space-y-3 rounded-2xl p-4 sm:p-5 border-2 shadow-xs">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <h2 id="sec2Title" class="text-lg sm:text-xl font-bold pl-3 border-l-4">三、深度解析：政策、重大事件與技術突破</h2>
        <select id="sec2Sort" class="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white text-slate-700 cursor-pointer">
          <option value="date">依日期排序（新→舊）</option>
          <option value="cat">依類別分組</option>
        </select>
      </div>
      <div id="sec2Content"></div>
    </section>

    <!-- SECTION 3: 各國藥監機關動態 -->
    <section id="sec3Container" class="space-y-3 rounded-2xl p-4 sm:p-5 border-2 shadow-xs">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <h2 id="sec3Title" class="text-lg sm:text-xl font-bold pl-3 border-l-4">四、各國藥監機關動態</h2>
        <select id="sec3Sort" class="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white text-slate-700 cursor-pointer">
          <option value="agency">依藥監機關分組</option>
          <option value="date">依日期排序（新→舊）</option>
        </select>
      </div>
      <div id="sec3Content"></div>
    </section>

    <!-- SECTION 4: 全球主要業者及指定重點關注標的 -->
    <section id="sec4Container" class="space-y-3 rounded-2xl p-4 sm:p-5 border-2 shadow-xs mb-8">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <h2 id="sec4Title" class="text-lg sm:text-xl font-bold pl-3 border-l-4">五、全球主要業者及指定重點關注標的</h2>
        <select id="sec4Sort" class="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white text-slate-700 cursor-pointer">
          <option value="group">關注標的優先分組</option>
          <option value="change">依漲跌幅排序</option>
        </select>
      </div>
      <div id="sec4Content"></div>
    </section>
  </main>

    ];

    function calcStartDate(endStr, days) {
      const end = new Date(endStr + 'T00:00:00');
      end.setDate(end.getDate() - Math.max(0, days - 1));
      return end.toISOString().slice(0, 10);
    }

    function loadPrefs() {
      const defaults = {
        channel: 'all',
        theme: 'vibrant',
        viewMode: window.innerWidth < 640 ? 'card' : 'table',
        periodDays: 7,
        startDate: calcStartDate(TODAY_STR, 7),
        endDate: TODAY_STR,
        visibleSection: 'all',
        watchlistOnly: false,
        activeModule: 'all',
        activeMarketCat: 'all',
        activeAgency: 'all',
        sec2Sort: 'date',
        sec3Sort: 'agency',
        sec4Sort: 'group'
      };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? Object.assign(defaults, JSON.parse(raw)) : defaults;
      } catch (_) {
        return defaults;
      }
    }

    function savePrefs() {
      try {
        const keys = ['channel','theme','viewMode','periodDays','startDate','endDate','visibleSection','watchlistOnly','activeModule','activeMarketCat','activeAgency','sec2Sort','sec3Sort','sec4Sort'];
        const obj = {};
        keys.forEach(k => obj[k] = state[k]);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
      } catch (_) {}
    }

    const state = Object.assign({}, loadPrefs(), {
      marketBriefs: DEFAULT_MARKET_BRIEFS,
      mhCurrentIdx: 0,
      reports: REPORTS_DATA,
      currentIndex: 0,
      searchQuery: '',
      expandedIds: {}
    });

    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function highlightText(text, query) {
      const safe = escapeHtml(text);
      if (!query || !query.trim()) return safe;
      const escapedQ = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp(`(${escapedQ})`, 'gi'), '<mark>$1</mark>');
    }

    function normDate(str) {
      const m = String(str || '').match(/(\d{4})[\/-](\d{2})[\/-](\d{2})/);
      return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
    }

    function isInDateRange(dateStr) {
      const d = normDate(dateStr);
      if (!d) return true;
      return d >= state.startDate && d <= state.endDate;
    }

    function hasRealUpdate(text) {
      const t = String(text || '');
      return !(t.includes('持穩無重大新增') || t.includes('無新增藥證') || t.includes('無新藥證增量'));
    }

    function changeColor(chg) {
      if (String(chg).includes('▲')) return 'text-rose-600 font-semibold';
      if (String(chg).includes('▼')) return 'text-emerald-600 font-semibold';
      return 'text-slate-500';
    }

    function outcomeBadge(outcome) {
      if (outcome.includes('優於預期')) return 'bg-emerald-100 text-emerald-800 border-emerald-200';
      if (outcome.includes('低於預期')) return 'bg-rose-100 text-rose-800 border-rose-200';
      if (outcome.includes('符合預期')) return 'bg-sky-100 text-sky-800 border-sky-200';
      return 'bg-amber-100 text-amber-800 border-amber-200';
    }

    function agencyBadgeClass(agency) {
      const map = {
        FDA: 'bg-blue-100 text-blue-800 border border-blue-200',
        EMA: 'bg-indigo-100 text-indigo-800 border border-indigo-200',
        NMPA: 'bg-rose-100 text-rose-800 border border-rose-200',
        TFDA: 'bg-emerald-100 text-emerald-800 border border-emerald-200',
        PMDA: 'bg-purple-100 text-purple-800 border border-purple-200'
      };
      return map[agency] || 'bg-slate-100 text-slate-700 border border-slate-200';
    }

    function deepCatClass(cat) {
      if (cat === '政策變化') return 'bg-blue-700 text-white';
      if (cat === '重大事件') return 'bg-rose-700 text-white';
      if (cat === '技術突破') return 'bg-teal-700 text-white';
      return 'bg-slate-800 text-white';
    }

    function renderExpandableCard(key, headerHtml, bodyHtml, extraClass) {

    function renderTableBlock(title, dotColor, accentCls, headers, rowsHtml) {
      return `

          <div class="px-4 py-2.5 border-b border-slate-200 ${accentCls}">

    /* 解析 HTML / Markdown 舊版資料為統一 sections 結構，並保證深層連結可點 */
    function extractLinksFromCell(cellEl) {
      const links = [];
      const seen = new Set();
      cellEl.querySelectorAll('a').forEach(a => {
        const href = a.getAttribute('href') || '';
        if (href.startsWith('http') && !href.includes('mail.google.com') && !seen.has(href)) {
          seen.add(href);
          links.push({ label: a.textContent.replace(/^↗\s*/, '').trim() || (href.includes('drive.google.com') ? '開啟報告 PDF' : '開啟來源文章'), url: href });
        }
      });
      if (!links.length) {
        const urlRegex = /(https?:\/\/[^\s<>"'）)]+)/g;
        const text = cellEl.textContent || '';
        let match;
        while ((match = urlRegex.exec(text)) !== null) {
          const url = match[1];
          if (!url.includes('mail.google.com') && !seen.has(url)) {
            seen.add(url);
            links.push({ label: url.includes('drive.google.com') ? '開啟報告 PDF' : '開啟來源文章', url });
          }
        }
      }
      return links;
    }

    function normalizeBriefToSections(item) {
      if (Array.isArray(item.sections) && item.sections.length > 0) return item.sections;
      const rawHtml = item.html ? item.html : marked.parse(item.markdown || '');
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = rawHtml;
      const sections = [];
      let currentCat = '跨產業財經與研報';
      Array.from(tempDiv.querySelectorAll('h2, h3, table')).forEach(el => {
        if (el.tagName === 'H2' || el.tagName === 'H3') {
          currentCat = el.textContent.replace(/^[一二三四五六七八九十]+、\s*/, '').trim();
        } else if (el.tagName === 'TABLE') {
          const items = [];
          el.querySelectorAll('tbody tr').forEach(tr => {
            const tds = tr.querySelectorAll('td');
            if (tds.length >= 5) {
              items.push({
                title: tds[0].textContent.trim(),
                summary: tds[1].textContent.trim(),
                trend: tds[2].textContent.trim(),
                tickers: tds[3].textContent.trim(),
                links: extractLinksFromCell(tds[4])
              });
            }
          });
          if (items.length) sections.push({ category: currentCat, items });
        }
      });
      return sections;
    }

    function renderDeepLinks(links, btnCls) {
      if (!Array.isArray(links) || !links.length) return '<span class="text-xs text-slate-400">待補附連結</span>';
      return `<div class="flex flex-wrap gap-1.5">${links.map(l =>
        `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2 py-1 rounded-lg border text-xs font-semibold transition ${btnCls}">↗ ${escapeHtml(l.label)}</a>`
      ).join('')}</div>`;
    }

    function renderSection0() {
      const briefs = state.marketBriefs;
      if (!briefs.length) {
        $('sec0Content').innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-sm text-slate-500">尚無全產業情報資料。</div>`;

      }

      const sel = $('mhEditionSelect');
      sel.innerHTML = briefs.map((b, i) => `<option value="${i}" ${i === state.mhCurrentIdx ? 'selected' : ''}>${escapeHtml(b.date)} ${escapeHtml(b.period)}</option>`).join('');

      const item = briefs[state.mhCurrentIdx] || briefs[0];
      $('mhEditionBadge').textContent = `${item.date} ${item.period}`;
      $('mhEditionMeta').textContent = `${item.title} ｜ 同步時間：${item.updatedAt}`;

      const sections = normalizeBriefToSections(item);
      const cats = sections.map(s => s.category);
      $('mhCategoryTabs').innerHTML = [
        `<button data-mcat="all" type="button" class="mcat-tab px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0 ${state.activeMarketCat === 'all' ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'}">全部產業</button>`,
        ...cats.map(c => `<button data-mcat="${escapeHtml(c)}" type="button" class="mcat-tab px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0 ${state.activeMarketCat === c ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'}">${escapeHtml(c)}</button>`)
      ].join('');

      const q = state.searchQuery.trim().toLowerCase();
      let out = '';

      sections.forEach((sec, sIdx) => {
        if (state.activeMarketCat !== 'all' && state.activeMarketCat !== sec.category) return;
        const matched = (sec.items || []).filter(r => !q || `${sec.category} ${r.title} ${r.summary} ${r.trend} ${r.tickers}`.toLowerCase().includes(q));
        if (!matched.length) return;
        const st = SUBBLOCK_STYLES[sIdx % SUBBLOCK_STYLES.length];

        if (state.viewMode === 'table') {
          out += renderTableBlock(sec.category, st.dot, st.accent, ['主題 / 報告名稱', '1. 內容摘要及前因後果', '2. 未來趨勢或影響分析', '3. 相關個股或主題', '4. 新聞或報告連結'], matched.map((r, i) => `
            <tr class="${i % 2 === 1 ? 'bg-slate-50/70' : 'bg-white'} hover:bg-slate-100/60">
              <td class="py-3 px-3 align-top font-bold text-slate-900 w-[17%]">${highlightText(r.title, q)}</td>
              <td class="py-3 px-3 align-top text-slate-700 leading-relaxed w-[31%]">${highlightText(r.summary, q)}</td>
              <td class="py-3 px-3 align-top text-slate-700 leading-relaxed w-[23%]">${highlightText(r.trend, q)}</td>
              <td class="py-3 px-3 align-top w-[13%]"><span class="inline-block px-2 py-0.5 rounded-md border text-xs font-semibold ${st.badge}">${highlightText(r.tickers, q)}</span></td>
              <td class="py-3 px-3 align-top w-[16%]">${renderDeepLinks(r.links, st.btn)}</td>
            </tr>
          `).join(''));
        } else {
          out += `<div class="space-y-2"><h3 class="text-sm font-bold text-slate-800 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full ${st.dot}"></span>${escapeHtml(sec.category)}（${matched.length}）</h3>${renderCardGrid(matched.map((r, idx) => renderExpandableCard(
            `s0-c-${sIdx}-${idx}`,
            `<div class="space-y-1.5">
              <div class="font-bold text-slate-900 text-sm leading-snug">${highlightText(r.title, q)}</div>
              <div><span class="inline-block px-2 py-0.5 rounded-md border text-[11px] font-semibold ${st.badge}">${highlightText(r.tickers, q)}</span></div>
              <div class="text-xs text-slate-600 line-clamp-2">${highlightText(r.summary, q)}</div>
            </div>`,
            `<div><b>1. 內容摘要及前因後果：</b>${highlightText(r.summary, q)}</div>
             <div><b>2. 未來趨勢或影響分析：</b>${highlightText(r.trend, q)}</div>
             <div class="pt-1">${renderDeepLinks(r.links, st.btn)}</div>`,
            `bg-white ${st.cardTop}`
          )).join(''))}</div>`;
        }

      $('sec0Content').innerHTML = out || `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-sm text-slate-500">此篩選條件下無符合的全產業新聞或研究報告。</div>`;
    }

    function getMultiDayAggregatedReport() {
      const matching = state.reports.filter(r => isInDateRange(r.date));
      const sourceList = matching.length ? matching : [state.reports[state.currentIndex]];
      const isMulti = state.periodDays !== 1 && sourceList.length > 1;
      if (!isMulti) return { isMulti: false, count: 1, rep: state.reports[state.currentIndex] };

      const dedupSort = (arr, keyFn) => {
        const seen = new Map();
        arr.forEach(item => { const k = keyFn(item).toLowerCase(); if (!seen.has(k)) seen.set(k, item); });
        return Array.from(seen.values()).sort((a, b) => ((b.importance || 3) - (a.importance || 3)) || String(b.date || '').localeCompare(String(a.date || '')));
      };
      const coAll = [], regAll = [], catAll = [], deepAll = [], topicsSet = new Set();
      sourceList.forEach(r => {
        r.co.filter(i => hasRealUpdate(i.summary)).forEach(i => coAll.push(i));
        r.reg.filter(i => hasRealUpdate(i.detail)).forEach(i => regAll.push(i));
        r.cat.forEach(i => catAll.push(i));
        r.deep.forEach(i => deepAll.push(i));
        (r.topics || []).forEach(t => topicsSet.add(t));
      });
      return {
        isMulti: true,
        count: sourceList.length,
        rep: {
          id: 'multi',
          date: `${state.startDate.replace(/-/g, '/')} – ${state.endDate.replace(/-/g, '/')}`,
          session: `精選彙整 (${sourceList.length} 期)`,
          headline: `已自動彙整區間內 ${sourceList.length} 期生醫早晚報，去重並依重要性排序`,
          topics: Array.from(topicsSet).slice(0, 5),
          co: dedupSort(coAll, i => i.ticker || i.name),
          reg: dedupSort(regAll, i => `${i.agency}-${i.title}`),
          cat: dedupSort(catAll, i => i.asset),
          deep: dedupSort(deepAll, i => i.title)
        }
      };
    }

      const q = state.searchQuery.trim().toLowerCase();

      const co = rep.co.filter(i => hasRealUpdate(i.summary) && (!state.watchlistOnly || i.watchlist) && match(`${i.ticker} ${i.name} ${i.summary} ${i.analysis || ''} ${i.source}`));
      const reg = rep.reg.filter(i => hasRealUpdate(i.detail) && (state.activeAgency === 'all' || i.agency === state.activeAgency) && match(`${i.agency} ${i.title} ${i.detail} ${i.analysis || ''} ${i.source}`));
      const cat = rep.cat.filter(i => match(`${i.asset} ${i.type} ${i.outcome} ${i.note} ${i.analysis || ''}`));
      const deep = rep.deep.filter(i => match(`${i.cat} ${i.title} ${i.body} ${i.analysis || ''} ${i.source}`));

      const showCo = (state.activeModule === 'all' || state.activeModule === 'co') && co.length > 0;
      const showReg = (state.activeModule === 'all' || state.activeModule === 'reg') && reg.length > 0;
      const showCat = (state.activeModule === 'all' || state.activeModule === 'cat') && cat.length > 0;

      let out = '';

              <td class="py-2.5 px-3 align-top whitespace-nowrap font-bold text-slate-900">${item.watchlist ? '<span class="text-amber-500 mr-0.5">★</span>' : ''}${highlightText(item.name, q)} <span class="text-xs font-normal text-slate-500">${highlightText(item.ticker, q)}</span></td>
              <td class="py-2.5 px-3 align-top whitespace-nowrap"><span class="font-medium">${escapeHtml(item.price)}</span> <span class="text-xs ${changeColor(item.change)}">${escapeHtml(item.change)}</span></td>
              <td class="py-2.5 px-3 align-top whitespace-nowrap text-xs text-slate-500">${escapeHtml(item.date)}</td>

      const agg = getMultiDayAggregatedReport();
      const marketTopics = ['數聯資安 7974', 'SpaceX', '嘉澤 3533', '關稅 301'];
      const topics = [...marketTopics, ...(agg.rep.topics || [])].slice(0, 8);
      $('relatedTopicsBar').innerHTML = topics.map(t => {
        const active = state.searchQuery.trim().toLowerCase() === t.toLowerCase();
        return `<button data-topic="${escapeHtml(t)}" type="button" class="topic-chip px-2.5 py-1 rounded-full text-xs font-medium border transition cursor-pointer ${active ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-sky-50'}">${escapeHtml(t)}</button>`;
      }).join('');
    }

    function syncControlHighlights() {
      document.querySelectorAll('.ch-btn').forEach(b => {
        const a = b.dataset.channel === state.channel;
        b.className = `ch-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer ${a ? 'bg-sky-500 text-white' : 'text-slate-200 hover:text-white'}`;
      });
      const isTable = state.viewMode === 'table';
      $('btnViewTable').className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer ${isTable ? 'bg-sky-500 text-white' : 'text-slate-200 hover:text-white'}`;
      $('btnViewCard').className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold transition cursor-pointer ${!isTable ? 'bg-sky-500 text-white' : 'text-slate-200 hover:text-white'}`;

      document.querySelectorAll('.period-btn').forEach(b => {
        const a = Number(b.dataset.days) === state.periodDays;
        b.className = `period-btn px-2 py-1 rounded-md font-medium cursor-pointer shrink-0 ${a ? 'bg-sky-500 text-white' : 'bg-white/10 text-slate-200 hover:bg-white/20'}`;
      });
      $('startDateInput').value = state.startDate;
      $('endDateInput').value = state.endDate;

      document.querySelectorAll('.sec-btn').forEach(b => {
        const a = b.dataset.sec === state.visibleSection;
        b.className = `sec-btn px-2.5 py-1 rounded-md font-medium cursor-pointer shrink-0 ${a ? 'bg-sky-500 text-white' : 'bg-white/10 text-slate-200 hover:bg-white/20'}`;
      });
      document.querySelectorAll('.mod-tab').forEach(b => {
        const a = b.dataset.mod === state.activeModule;
        b.className = `mod-tab px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0 ${a ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'}`;
      });
      document.querySelectorAll('.agency-chip').forEach(b => {
        const a = b.dataset.agency === state.activeAgency;
        b.className = `agency-chip px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer shrink-0 ${a ? 'bg-sky-100 text-sky-800' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
      });
      $('btnWatchlistOnly').classList.toggle('bg-amber-50', state.watchlistOnly);
      $('btnWatchlistOnly').classList.toggle('border-amber-300', state.watchlistOnly);
    }

    function render() {
      applyTheme();
      syncControlHighlights();

      const showMarket = state.channel === 'all' || state.channel === 'market';
      const showBio = state.channel === 'all' || state.channel === 'biotech';

      $('sec0Container').classList.toggle('hidden', !(showMarket && (state.visibleSection === 'all' || state.visibleSection === '0')));
      ['1', '2', '3', '4'].forEach(s => {
        $(`sec${s}Container`).classList.toggle('hidden', !(showBio && (state.visibleSection === 'all' || state.visibleSection === s)));
      });

      const hasFilter = Boolean(state.searchQuery.trim() || state.watchlistOnly || state.activeAgency !== 'all');
      $('searchStatusBanner').classList.toggle('hidden', !hasFilter);
      if (hasFilter) {
        $('searchStatusText').textContent = `篩選中｜區間：${state.startDate} ～ ${state.endDate}${state.searchQuery.trim() ? `｜關鍵字：${state.searchQuery.trim()}` : ''}${state.watchlistOnly ? '｜僅看關注股' : ''}${state.activeAgency !== 'all' ? `｜藥監：${state.activeAgency}` : ''}`;
      }

      renderRelatedTopics();
      renderSection0();
      renderSection1();
      renderSection2();
      renderSection3();
      renderSection4();
      savePrefs();
      if (window.lucide) lucide.createIcons();
    }

    function switchEdition(newIdx, dir) {
      if (newIdx < 0 || newIdx >= state.reports.length) return;
      state.periodDays = 1;
      const d = normDate(state.reports[newIdx].date) || TODAY_STR;
      state.startDate = d;
      state.endDate = d;
      const el = $('swipeContainer');
      el.classList.add(dir === 'left' ? 'swipe-left' : 'swipe-right');
      setTimeout(() => { state.currentIndex = newIdx; render(); el.classList.remove('swipe-left', 'swipe-right'); }, 130);
    }

    document.querySelectorAll('.ch-btn').forEach(btn => {
      btn.addEventListener('click', () => { state.channel = btn.dataset.channel; state.visibleSection = 'all'; render(); });
    });
    $('themeSelect').addEventListener('change', (e) => { state.theme = e.target.value; render(); });
    $('btnViewTable').addEventListener('click', () => { state.viewMode = 'table'; render(); });
    $('btnViewCard').addEventListener('click', () => { state.viewMode = 'card'; render(); });
    $('mhEditionSelect').addEventListener('change', (e) => { state.mhCurrentIdx = Number(e.target.value); state.activeMarketCat = 'all'; renderSection0(); if (window.lucide) lucide.createIcons(); });
    $('mhCategoryTabs').addEventListener('click', (e) => { const btn = e.target.closest('.mcat-tab'); if (!btn) return; state.activeMarketCat = btn.dataset.mcat; renderSection0(); if (window.lucide) lucide.createIcons(); });
    $('btnPrevDate').addEventListener('click', () => switchEdition(state.currentIndex - 1, 'right'));
    $('btnNextDate').addEventListener('click', () => switchEdition(state.currentIndex + 1, 'left'));

    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.periodDays = Number(btn.dataset.days);
        state.endDate = TODAY_STR;
        state.startDate = calcStartDate(TODAY_STR, state.periodDays);
        render();
      });
    });

    $('startDateInput').addEventListener('change', (e) => { if (!e.target.value) return; state.periodDays = 0; state.startDate = e.target.value; if (state.startDate > state.endDate) state.endDate = state.startDate; render(); });
    $('endDateInput').addEventListener('change', (e) => { if (!e.target.value) return; state.periodDays = 0; state.endDate = e.target.value; if (state.endDate < state.startDate) state.startDate = state.endDate; render(); });
    document.querySelectorAll('.sec-btn').forEach(btn => btn.addEventListener('click', () => { state.visibleSection = btn.dataset.sec; if (state.visibleSection === '0') state.channel = 'all'; render(); }));
    $('datePills').addEventListener('click', (e) => { const btn = e.target.closest('.date-pill'); if (!btn) return; const idx = Number(btn.dataset.idx); switchEdition(idx, idx > state.currentIndex ? 'left' : 'right'); });
    document.querySelector('main').addEventListener('click', (e) => { const btn = e.target.closest('.expand-btn'); if (!btn) return; e.preventDefault(); const y = window.scrollY; const key = btn.dataset.toggle; state.expandedIds[key] = !state.expandedIds[key]; render(); window.scrollTo(0, y); });
    $('searchInput').addEventListener('input', (e) => { state.searchQuery = e.target.value; $('btnClearSearch').classList.toggle('hidden', !state.searchQuery); render(); });
    $('btnClearSearch').addEventListener('click', () => { $('searchInput').value = ''; state.searchQuery = ''; $('btnClearSearch').classList.add('hidden'); render(); });
    $('relatedTopicsBar').addEventListener('click', (e) => { const btn = e.target.closest('.topic-chip'); if (!btn) return; const t = btn.dataset.topic; state.searchQuery = state.searchQuery.trim().toLowerCase() === t.toLowerCase() ? '' : t; $('searchInput').value = state.searchQuery; $('btnClearSearch').classList.toggle('hidden', !state.searchQuery); render(); });
    $('btnWatchlistOnly').addEventListener('click', () => { state.watchlistOnly = !state.watchlistOnly; render(); });
    $('moduleTabs').addEventListener('click', (e) => { const btn = e.target.closest('.mod-tab'); if (!btn) return; state.activeModule = btn.dataset.mod; render(); });
    $('agencyChips').addEventListener('click', (e) => { const btn = e.target.closest('.agency-chip'); if (!btn) return; state.activeAgency = btn.dataset.agency; render(); });
    $('btnResetFilters').addEventListener('click', () => { $('searchInput').value = ''; state.searchQuery = ''; state.watchlistOnly = false; state.activeAgency = 'all'; state.activeMarketCat = 'all'; $('btnClearSearch').classList.add('hidden'); render(); });
    $('sec2Sort').addEventListener('change', (e) => { state.sec2Sort = e.target.value; savePrefs(); renderSection2(); if (window.lucide) lucide.createIcons(); });
    $('sec3Sort').addEventListener('change', (e) => { state.sec3Sort = e.target.value; savePrefs(); renderSection3(); if (window.lucide) lucide.createIcons(); });
    $('sec4Sort').addEventListener('change', (e) => { state.sec4Sort = e.target.value; savePrefs(); renderSection4(); if (window.lucide) lucide.createIcons(); });

    async function loadRemoteData() {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      // 1. 載入全產業與研報 JSON
      try {
        const resM = await fetch('./market_briefs.json?t=' + Date.now(), { cache: 'no-store' });
        if (resM.ok) {
          const remoteM = await resM.json();
          if (Array.isArray(remoteM) && remoteM.length > 0) {
            const mapM = new Map();
            DEFAULT_MARKET_BRIEFS.forEach(b => mapM.set(b.id, b));
            remoteM.forEach(b => { if (b && b.id) mapM.set(b.id, b); });
            state.marketBriefs = Array.from(mapM.values()).sort((a, b) => String(b.id).localeCompare(String(a.id)));
          }
        }
      } catch (_) {}

      // 2. 載入生醫早晚報 JSON
      try {
        const resB = await fetch('./data/reports_index.json?t=' + Date.now(), { cache: 'no-store' });
        if (resB.ok) {
          const remoteB = await resB.json();
          if (Array.isArray(remoteB) && remoteB.length > 0) {
            const mapB = new Map();
            REPORTS_DATA.forEach(r => mapB.set(r.id, r));
            remoteB.forEach(r => { if (r && r.id && Array.isArray(r.co)) mapB.set(r.id, r); });
            state.reports = Array.from(mapB.values()).sort((a, b) => String(b.id).localeCompare(String(a.id)));
          }
        }
      } catch (_) {}

      render();
    }

    render();
    loadRemoteData();
  </script>
</body>
</html>
